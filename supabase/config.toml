project_id = "gamemap"

[api]
enabled = true
port = 54321
# catalog remains private: only reviewed public RPCs are exposed.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4191"
additional_redirect_urls = ["http://127.0.0.1:4191/auth/callback**"]
# Public accounts have community access only, never Studio/catalog membership.
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.rate_limit]
# Owned-loopback development mail is captured by Mailpit, not sent externally.
email_sent = 60
sign_in_sign_ups = 60

[auth.external.github]
enabled = false
client_id = ""
secret = ""
# Enable only after creating a real GitHub OAuth app; see community/README.md.
