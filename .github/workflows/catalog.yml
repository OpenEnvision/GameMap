name: Validate research catalog

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: catalog-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate and check committed source outputs
        run: |
          node scripts/build/generate.mjs
          git diff --exit-code -- data/resources.json website/src/data/resources.json website/public docs
      - name: Validate source catalog, translations, and formatting
        run: npm run check
      - name: Build static website
        run: npm run build
        env:
          PAGES_BASE_PATH: /GameMap/
      - name: Validate generated build output
        run: npm run check:build
