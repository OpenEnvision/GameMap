name: Deploy GameMap to GitHub Pages

# Deploys the static GameMap site with BlogrXiv-style zero-server Supabase Direct Community mode.
# Optionally override public Repository Variables in GitHub Settings -> Secrets and variables -> Actions -> Variables:
#   GAMEMAP_SUPABASE_URL
#   GAMEMAP_SUPABASE_PUBLISHABLE_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: npm ci
      - name: Check generated source outputs
        run: |
          node scripts/build/generate.mjs
          git diff --exit-code -- data/resources.json website/src/data/resources.json website/public docs
      - name: Build static website with Supabase Direct Community mode
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_GAMEMAP_COMMUNITY: "1"
          VITE_GAMEMAP_COMMUNITY_MODE: "supabase-direct"
          VITE_SUPABASE_URL: ${{ vars.GAMEMAP_SUPABASE_URL || 'https://ckewjnufjwgwbcuapxiw.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.GAMEMAP_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_MhGapjdqxzzxgbWXyaUrRA_-x2CO2aC' }}
      - name: Validate built website
        run: npm run check:build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
