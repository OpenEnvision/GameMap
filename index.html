nts, viewport and capture options: animation disabling, masks and styles can alter evidence. DOM access is a different observation surface from screenshot-only control or Playwright MCP.",url:"https://playwright.dev/docs/test-snapshots",links:[{label:"Actionability",url:"https://playwright.dev/docs/actionability"},{label:"Screenshot assertion API",url:"https://playwright.dev/docs/api/class-pageassertions"}],tags:["Browser testing","Visual regression","DOM"],stages:["code","test"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"solarrenderer",name:"SolarRenderer",category:"world",type:"paper",summary:"Turns engine- or agent-generated structure videos into styled final visuals.",detail:"Few-Step Generative Reference Rendering conditions MiniMax-H3 on semantic maps, grayboxes, skeletons, depth, and other structures, with an optional first frame and text. Control and four-step LoRAs include a block-causal variant. Code is Apache-2.0; weights use the geographically restricted MiniMax H3 Community License, and data has component-specific terms, including noncommercial and research-only portions. Upstream programs must maintain world state and rules. Four-step sampling alone does not establish real-time consumer-hardware interaction.",url:"https://enderfga.cn/SolarRenderer/",links:[{label:"Code",url:"https://github.com/Enderfga/SolarRenderer"},{label:"Paper PDF",url:"https://enderfga.cn/data/solarrenderer.pdf"},{label:"Weights",url:"https://huggingface.co/Enderfga/SolarRenderer"},{label:"Data and evaluation",url:"https://huggingface.co/datasets/Enderfga/SolarRenderer-Data"},{label:"Usage guide",url:"https://github.com/Junchao-cs/SolarWM/blob/main/docs/solar_renderer.md"}],tags:["hybrid-renderer","structure-conditioning","streaming","MiniMax-H3","LoRA","released-code"],stages:["code","scene","world"],dimensions:["2d","3d","world"],year:2026,verified:"2026-10-18"},{id:"streamrender-h3",name:"StreamRender-H3",category:"world",type:"framework",summary:"A code engine maintains the world while streaming diffusion renders its semantic maps.",detail:"NVIDIA Sol-Engine's Interactive Coding Worlds system uses a three.js racing game. The engine handles map, physics, collision, and input, while a two-step streaming MiniMax-H3 model renders semantic video conditioned on a first frame and prompt. Reported training and tests cover that one game and third-person view. Semantic colors identify classes rather than individual objects. Performance results use eight GB200 GPUs; stage throughput does not establish end-to-end input-to-display latency.",url:"https://nvlabs.github.io/Sana/Sol-Engine/StreamRender-H3/",links:[{label:"Sol-Engine",url:"https://nvlabs.github.io/Sana/Sol-Engine/"},{label:"Agent workflow",url:"https://nvlabs.github.io/Sana/Sol-Engine/docs/agent-workflow/"}],tags:["hybrid-renderer","executable-state","streaming","three.js","MiniMax-H3","NVIDIA"],stages:["code","scene","world"],dimensions:["3d","world"],year:2026,verified:"2026-10-18"},{id:"code-world-model-brain",name:"Code World Model: Coding Agent as World Brain",category:"world",type:"paper",summary:"A coding agent writes executable rules and persistent state to drive a video world.",detail:"Separates world evolution from visual generation. An agent maintains executable state, which is compiled into controls for a fine-tuned MiniMax-H3 renderer. The released inference interface uses an RGB first-frame anchor, per-frame depth and semantic-ID controls, and per-window prompts. Inference code, LoRAs, and examples are public, but the underlying game code that generates proxies cannot be redistributed. The complete agent-to-engine pipeline cannot be reproduced unchanged from those artifacts.",url:"https://arxiv.org/abs/2608.25927",links:[{label:"Project",url:"https://buaacyw.github.io/cwm/"},{label:"Inference code",url:"https://github.com/buaacyw/code-world-model"},{label:"Reproduction scope",url:"https://github.com/buaacyw/code-world-model/blob/main/ENVIRONMENT.md"}],tags:["code-world-model","coding-agent","executable-state","hybrid-renderer","MiniMax-H3","partial-release"],stages:["plan","code","world"],dimensions:["3d","world"],year:2026,verified:"2026-10-18"},{id:"programmable-world-model",name:"Programmable World Model",category:"world",type:"paper",summary:"Explicit global state and programmable rules preserve entities outside the camera view.",detail:"An agent converts instructions into entity states and state-transition programs. A lightweight engine maintains global state, then compiles stateful 3D oriented bounding boxes and camera trajectories into video model controls. The paper introduces CombatStateBench to check entity counts and irreversible states. The public repository currently centers on project documentation, which does not establish that complete inference code and weights are available.",url:"https://arxiv.org/abs/2609.10540",links:[{label:"Project and release progress",url:"https://github.com/AlayaLab/pwm"}],tags:["code-world-model","executable-state","hybrid-renderer","persistent-state","CombatStateBench"],stages:["code","test","world"],dimensions:["3d","world"],year:2026,verified:"2026-10-18"},{id:"coder-world-model",name:"CoDeR — Code Plans, Diffusion Renders",category:"world",type:"paper",summary:"Collaborating agents build executable worlds, with diffusion models rendering observations.",detail:"Code Plans, Diffusion Renders: Open-Ended Generative World Modeling uses five collaborating roles to turn concepts into rules, code, and observations, allowing entities to keep evolving outside the current view. The paper studies long-term memory, open-ended interaction, and multi-agent worlds. Its abstract says code and weights will be released; distinguish reported results from artifacts already available.",url:"https://arxiv.org/abs/2609.26458",links:[{label:"Project",url:"https://becauseimbatman0.github.io/CoDeR"}],tags:["code-world-model","multi-agent","hybrid-renderer","persistent-state","research"],stages:["plan","code","world"],dimensions:["3d","world"],year:2026,verified:"2026-10-18"},{id:"magpie-renderer",name:"Magpie: Real-Time World Renderer for Interactive Games",category:"world",type:"paper",summary:"A game engine runs gameplay while a separate Render Server generates final visuals.",detail:"Designers define scenes and rules in a conventional game engine. At runtime, the engine processes player actions and maintains state, while a rendering service transforms engine-produced whitebox frames into final visuals. It demonstrates a division between generative rendering and reproducible gameplay, primarily reducing prototype dependence on complete art assets.",url:"https://arxiv.org/abs/2608.27168",tags:["hybrid-renderer","executable-state","game-engine","render-server","research"],stages:["code","scene","world"],dimensions:["3d","world"],year:2026,verified:"2026-10-18"},{id:"solarwm",name:"SolarWM",category:"world",type:"paper",summary:"An interactive video world model framework for open data, training, and long-horizon inference.",detail:"Unifies data, training, and inference interfaces for camera-controlled streaming video. The source matrix lists all three stages for Wan2.2-5B and MiniMax-H3, but later stages for Wan2.2-14B and LTX-2.5 remain forthcoming. Backbones require separate runtime environments. The main data release contains annotations and indexes; latent payloads are separate, and the full processed training-video corpus requires reconstruction or approved access. This infrastructure does not provide a code world with queryable entity state.",url:"https://arxiv.org/abs/2609.02886",links:[{label:"Code and documentation",url:"https://github.com/Junchao-cs/SolarWM"},{label:"Project",url:"https://junchao-cs.github.io/SolarWM-Web/"}],tags:["interactive-video","training-framework","camera-control","streaming","released-code"],stages:["code","scene","world"],dimensions:["3d","world"],year:2026,verified:"2026-10-18"},{id:"worldcoder",name:"WorldCoder",category:"world",type:"paper",summary:"Induces Python world models from environment interactions, then plans within them.",detail:"WorldCoder, a Model-Based LLM Agent represents knowledge of a world as executable Python programs. Interaction records constrain those programs, and planning searches for potential rewards. This NeurIPS 2024 work is primarily evaluated on gridworlds and task planning. It supports study of rule discovery and model repair rather than complete visual game generation.",url:"https://arxiv.org/abs/2402.12275",tags:["code-world-model","program-synthesis","model-based-planning","gridworld","NeurIPS-2024"],stages:["plan","code","world"],dimensions:["2d","world"],year:2024,verified:"2026-10-18"},{id:"gif-mcts-cwm",name:"GIF-MCTS / Code World Models Benchmark",category:"world",type:"paper",summary:"Synthesizes runnable environment models through generate, improve, and fix tree search.",detail:"Generating Code World Models with Large Language Models Guided by Monte Carlo Tree Search encodes transition, reward, and termination logic in Python. Trajectories and test feedback guide GIF-MCTS search. The paper also releases CWMB, covering 18 reinforcement learning environments, to evaluate model correctness and downstream planning. It is a foundational reading and evaluation reference for code world models.",url:"https://arxiv.org/abs/2405.15383",links:[{label:"Code and CWMB",url:"https://github.com/nicoladainese96/code-world-models"},{label:"Project",url:"https://sites.google.com/view/code-world-models/home"}],tags:["code-world-model","program-synthesis","MCTS","benchmark","CWMB","NeurIPS-2024"],stages:["plan","code","test","world"],dimensions:["2d","3d","world"],year:2024,verified:"2026-10-18"},{id:"cwm-general-game-playing",name:"Code World Models for General Game Playing",category:"world",type:"paper",summary:"Compiles natural-language game rules into verifiable simulators for MCTS planning.",detail:"Generates Python state-transition, legal-action, and termination functions from rules and game trajectories, plus heuristic value and hidden-state inference functions for planning. The paper evaluates 10 fully or partially observable games, including board and card games. Avoiding illegal actions depends on the synthesized rules being correct, so model validation remains necessary.",url:"https://arxiv.org/abs/2510.04542",tags:["code-world-model","game-rules","MCTS","formal-simulator","imperfect-information"],stages:["plan","code","test","world"],dimensions:["2d","world"],year:2025,verified:"2026-10-18"},{id:"poe-world",name:"PoE-World",category:"world",type:"paper",summary:"Combines small programmatic experts to model stochastic world dynamics.",detail:"Compositional World Modeling with Products of Programmatic Experts combines LLM-synthesized programs in an exponentially weighted product of experts, learning complex stochastic world models from few observations. The paper connects these models to planners in Pong and Montezuma's Revenge to demonstrate sample efficiency and generalization to new levels. This is programmatic dynamics modeling rather than an art generation tool.",url:"https://arxiv.org/abs/2505.10819",links:[{label:"Code",url:"https://github.com/topwasu/poe-world"},{label:"Project",url:"https://topwasu.github.io/poe-world"}],tags:["code-world-model","program-synthesis","stochastic-dynamics","Atari","model-based-planning"],stages:["plan","code","world"],dimensions:["2d","world"],year:2025,verified:"2026-10-18"},{id:"factorsim",name:"FactorSim",category:"world",type:"paper",summary:"Generates complete simulation code from language using factorized state representations.",detail:"Generative Simulation via Factorized Representation uses a factorized POMDP representation to reduce the context needed for each generation step. It aims to generate complete game or robotics simulators for agent training. This NeurIPS 2024 work also provides a generative simulation benchmark and supports study of workflows from design specifications to modular rule code.",url:"https://arxiv.org/abs/2409.17652",links:[{label:"Project",url:"https://cs.stanford.edu/~sunfanyun/factorsim/"}],tags:["code-world-model","simulation-generation","POMDP","benchmark","NeurIPS-2024"],stages:["plan","code","test","world"],dimensions:["2d","3d","world"],year:2024,verified:"2026-10-18"},{id:"genie",name:"Genie: Generative Interactive Environments",category:"world",type:"paper",summary:"Learns latent-action-controlled 2D worlds from videos without action labels.",detail:"Combines a spatiotemporal video tokenizer, autoregressive dynamics, and a latent action model into generative interactive environments. Users can begin with an image or sketch and explore frame by frame. The ICML 2024 contribution centers on learning control without ground-truth action labels. Dynamics remain implicit in the model, without editable or queryable game rule programs.",url:"https://arxiv.org/abs/2402.15391",tags:["interactive-video","latent-actions","neural-simulator","2D-platformer","ICML-2024"],stages:["world"],dimensions:["2d","world"],year:2024,verified:"2026-10-18"},{id:"genie-3",name:"Genie 3 / Project Genie",category:"world",type:"tool",summary:"Generates interactive video worlds from prompts for real-time exploration.",detail:"Google DeepMind introduced Genie 3 in 2025, demonstrating interactive worlds at 720p and 24 FPS with consistency lasting several minutes, and providing an experience through Project Genie. It represents neural interactive worlds. The official presentation does not imply downloadable engine source, exportable level assets, or deterministic gameplay rules.",url:"https://deepmind.google/blog/genie-3-a-new-frontier-for-world-models/",tags:["interactive-video","neural-simulator","text-to-world","Google-DeepMind","hosted"],stages:["plan","world"],dimensions:["3d","world"],year:2025,verified:"2026-10-18"},{id:"gamengen",name:"GameNGen — Diffusion Models Are Real-Time Game Engines",category:"world",type:"paper",summary:"Trains an interactive diffusion simulator from DOOM gameplay trajectories.",detail:"A reinforcement learning agent first collects game trajectories. A diffusion model then predicts the next frame from visual history and actions, using conditioning noise augmentation to reduce autoregressive error. The paper demonstrates real-time DOOM simulation on a single TPU. This game-specific neural simulation does not automatically provide maintainable general game rules or an asset pipeline.",url:"https://arxiv.org/abs/2408.14837",links:[{label:"Project",url:"https://gamengen.github.io/"}],tags:["neural-simulator","interactive-video","diffusion","DOOM","ICLR-2025"],stages:["test","world"],dimensions:["3d","world"],year:2024,verified:"2026-10-18"},{id:"diamond",name:"DIAMOND — Diffusion for World Modeling",category:"world",type:"paper",summary:"Trains reinforcement learning agents inside diffusion world models that preserve visual detail.",detail:"Visual Details Matter in Atari studies diffusion models as environment models in which agents learn from imagined trajectories, analyzing how visual detail affects policies. Alongside the Atari 100k evaluation, the paper trains a playable neural engine on prerecorded CS:GO gameplay. It is relevant to simulation, control, and accumulated prediction error.",url:"https://arxiv.org/abs/2405.12399",links:[{label:"Code and playable models",url:"https://diamond-wm.github.io/"}],tags:["neural-simulator","interactive-video","diffusion","Atari","reinforcement-learning","NeurIPS-2024"],stages:["test","world"],dimensions:["2d","3d","world"],year:2024,verified:"2026-10-18"},{id:"gamefactory",name:"GameFactory",category:"world",type:"paper",summary:"Combines open-domain video generation with keyboard and mouse action control.",detail:"Creating New Games with Generative Interactive Videos proposes domain adapters and action-control modules for autoregressive game video. The public GF-Minecraft dataset includes action labels; the checked repository provides dataset documentation and detection/visualization utilities, without establishing a released training/inference pipeline or model weights. Visual generalization should be evaluated separately from rule correctness, item persistence, and exportable game projects.",url:"https://arxiv.org/abs/2501.08325",links:[{label:"Dataset tools and documentation",url:"https://github.com/KlingAIResearch/GameFactory"},{label:"GF-Minecraft dataset",url:"https://huggingface.co/datasets/KlingTeam/GameFactory-Dataset"}],tags:["interactive-video","neural-simulator","action-control","Minecraft","dataset","ICCV-2025"],stages:["world"],dimensions:["3d","world"],year:2025,verified:"2026-10-18"},{id:"oasis",name:"Oasis: A Universe in a Transformer",category:"world",type:"framework",summary:"A neural game research release that predicts Minecraft-style frames from prior frames and actions.",detail:"Oasis by Decart and Etched uses a Transformer autoencoder and latent diffusion. Its MIT-licensed inference code and 500M checkpoint are a downsized release, separate from the larger hosted demo. The public script generates video from an initial frame and action sequence; it does not establish a complete live game interface or training pipeline. The authors identify limits in long-term memory, precise inventory control, generalization, and object consistency.",url:"https://oasis-model.github.io/",links:[{label:"Inference code",url:"https://github.com/etched-ai/open-oasis"},{label:"500M model and license",url:"https://huggingface.co/Etched/oasis-500m"}],tags:["neural-simulator","interactive-video","transformer","Minecraft","released-code"],stages:["code","world"],dimensions:["3d","world"],year:2024,verified:"2026-10-18"},{id:"wonderworld",name:"WonderWorld",category:"world",type:"paper",summary:"Builds an explorable, expandable explicit 3D scene from a single image.",detail:"Interactive 3D Scene Generation from a Single Image uses Fast Layered Gaussian Surfels and guided depth diffusion to connect new scenes as the camera moves and prompts change. It provides explicit spatial representation and real-time rendering, primarily addressing geometry and appearance. Interactive gameplay, physics, and persistent dynamic state still require separate implementation.",url:"https://arxiv.org/abs/2406.09394",links:[{label:"Project",url:"https://kovenyu.com/WonderWorld/"}],tags:["scene-generation","explicit-3d","Gaussian-surfels","camera-control","CVPR-2025"],stages:["assets","scene","world"],dimensions:["3d","world"],year:2024,verified:"2026-10-18"},{id:"marble",name:"World Labs Marble",category:"world",type:"tool",summary:"Generates persistent, navigable 3D scenes with splat and mesh exports.",detail:"Marble supports multimodal world creation, exports Gaussian splats, visual meshes, and collision meshes for approximate physics, and renders video along camera paths. Compared with pure video continuation, it produces spatial assets for downstream engines. Developers still need to build character behavior, quest logic, and game loops.",url:"https://www.worldlabs.ai/blog/marble-world-model",links:[{label:"Product",url:"https://marble.worldlabs.ai/"}],tags:["scene-generation","explicit-3d","Gaussian-splatting","mesh-export","hosted"],stages:["assets","scene","world"],dimensions:["3d","world"],year:2025,verified:"2026-10-18"}];Ua();Ze();var jt=[{id:"agents",label:"Coding agents",color:"#6e9d51",description:"Turn ideas into code with agents, skills, and engine integrations."},{id:"engines",label:"Game engines",color:"#9780d5",description:"Official documentation, working examples, and practical engine knowledge."},{id:"2d",label:"2D development",color:"#ec965b",description:"Explore game generation, sprites, levels, and development benchmarks."},{id:"3d",label:"3D development",color:"#6b91d0",description:"Connect 3D assets and scene building with playable engine projects."},{id:"production",label:"Game production",color:"#64b8a3",description:"Create consistent art, sion shapes, and animation states on import.",deliverable:"An asset inventory, animation state table, and license records.",check:"Frames keep a consistent scale, collisions match the art, and sources are documented."},{title:"Playtest & iterate",subtitle:"Tune the experience",tags:["Benchmarks","Visual QA"],stage:"test",description:"Combine scripted inputs, state assertions, and key screenshots. Track build, gameplay, and visual issues separately, then playtest with people and adjust the pacing.",deliverable:"Input replays, key frames, and gameplay acceptance results.",check:"Failure, pause, restart, and extended play all have recorded test evidence."},{title:"Ship your world",subtitle:"Put it in players’ hands",tags:["Build","Player feedback"],stage:"ship",description:"Build for the target platform and check asset paths, controls, and loading. Record dependency versions, generation prompts, and known limits for the next iteration.",deliverable:"A distributable build, README, and release notes.",check:"Players on the target device can launch, load, play, and report issues."}],"3d":[{title:"Plan & scope",subtitle:"Start with one space",tags:["Vertical slice","Target device"],stage:"plan",description:"Define the camera, character controls, core interactions, and target hardware. Start with one room or level to keep the scope of the 3D project manageable.",deliverable:"A level sketch, interaction checklist, and performance targets.",check:"Target devices, quality settings, and the core experience are defined."},{title:"Choose an engine",subtitle:"Set up the pipeline",tags:["Unreal · Unity","Three.js · Godot"],stage:"scene",description:"Choose the engine, renderer, and physics approach, then connect MCP or editor automation. Plan for both code changes and scene or asset operations in the editor.",deliverable:"A minimal scene, editor integration, and build command.",check:"Creating objects, running the scene, and reading errors follow repeatable steps."},{title:"Build the loop",subtitle:"Bring space to life",tags:["Agent frameworks","Gameplay"],stage:"code",description:"Build movement, camera controls, collisions, and key interactions in a graybox level. Give the agent runtime state and errors as feedback while developing the gameplay.",deliverable:"A graybox level, character controller, and interaction state machine.",check:"Camera, collision, save, and restart behavior work correctly in the running game."},{title:"Create the assets",subtitle:"Make models game-ready",tags:["Mesh · Texture","Rig · Animation"],stage:"assets",description:"After generating or finding models, check scale, topology, materials, rigs, and animation. Prepare assets that the engine can load and use reliably.",deliverable:"GLB or engine assets, collision shapes, LODs, and a license inventory.",check:"Models are grounded and consistently scaled, with rendering and physics costs within budget."},{title:"Playtest & iterate",subtitle:"Test behavior and space",tags:["Runtime tests","Performance"],stage:"test",description:"Test scene connectivity, character behavior, physics stability, and frame times in the engine. Evaluate generated results with task checks and visual evidence.",deliverable:"Runtime test results, scene screenshots, and performance samples.",check:"Interactions are reachable, collisions are stable, key paths connect, and performance meets targets."},{title:"Ship your world",subtitle:"Package the experience",tags:["Packaging","Optimization"],stage:"ship",description:"Package for the target platform, trim unused assets, and verify loading. Record engine and plugin versions, hardware requirements, and reproduction steps.",deliverable:"An installer or web build, performance notes, and reproduction instructions.",check:"A clean install on the target device completes one full gameplay loop."}],world:[{title:"Define the state",subtitle:"Choose what holds truth",tags:["Code state","Scene graph"],stage:"plan",description:"Decide whether code, an explicit s a separately installed engine/toolsets. Several runners and examples are Windows-oriented; Codex integration is community-maintained, not endorsed by Epic or OpenAI. It does not bundle the engine server or a complete game.",official:!1,codeType:"mixed",publisher:"WildCake",reviewed:"2026-10-18"},{id:"gamelogicbench",title:"GameLogicBench",kind:"evaluation",agents:["claude-code","codex","opencode"],engine:"Godot",summary:"A coding-agent benchmark of 72 gameplay-logic tasks whose deterministic Godot evaluators check observable state at each simulation tick rather than grading agent-written claims.",sourceUrl:"https://github.com/NJU-LINK/GameLogicBench",codeUrl:"https://github.com/NJU-LINK/GameLogicBench/tree/main/geb",evidenceUrl:"https://github.com/NJU-LINK/GameLogicBench/blob/main/docs/running.md",codeScope:"Verified Python solve/judge/record pipeline, container/egress code, and separate claude_code.py, codex.py, and opencode.py adapters. The public GameLogicBench-Tasks repository is a separate dependency and contains the game/task/judge/reference content.",limitations:"Requires Docker, a matching Godot 4.4 environment, an agent CLI package, task-library checkout, and configured model endpoints. It evaluates runtime game logic, not visual quality or finished commercial-game production. Network restrictions and task-library commit materially affect results; do not treat model backends as additional coding-agent adapters.",official:!1,codeType:"implementation",publisher:"NJU-LINK",reviewed:"2026-10-18"},{id:"gamecraft-bench",title:"GameCraft-Bench",kind:"evaluation",agents:["claude-code","codex","kimi-code"],engine:"Godot",summary:"An end-to-end game-generation benchmark with 140 tasks across 15 families, runnable Godot workspaces, replayable input traces, screen recording, and hidden visual/gameplay rubrics.",sourceUrl:"https://github.com/FreedomIntelligence/gamecraft-bench",codeUrl:"https://github.com/FreedomIntelligence/gamecraft-bench/tree/main/gamecraft_bench",evidenceUrl:"https://github.com/FreedomIntelligence/gamecraft-bench/blob/main/README.md",codeScope:"Verified local Harbor agent/environment code, replay and scoring implementations, model-judge adapters, wrapper scripts for Claude Code/Codex/Kimi Code, and committed task instructions/reference-solution GDScript. The author's project site links this repository directly.",limitations:"Godot 4.6.2 and Linux/Xvfb/input-recording dependencies are pinned in the reproduction guide. Expected asset libraries are downloaded separately, with per-entry licensing. Rubric scores depend on the judge and replay protocol; Gemini judge support is not evidence of a Gemini CLI coding-agent adapter.",official:!1,codeType:"implementation",publisher:"FreedomIntelligence",reviewed:"2026-10-18"},{id:"summer-gemini-engine-extension",title:"Summer: Gemini CLI extension, engine MCP, and game skills",kind:"bridge",agents:["gemini-cli","antigravity","codex","claude-code","cursor","copilot","opencode"],engine:"Summer Engine",summary:"A publisher-maintained CLI/MCP integration for building scenes, writing scripts, playing games, reading errors, and taking screenshots in Summer Engine. It includes a genuine Gemini extension manifest, context file, skill packaging, and cross-agent setup code.",sourceUrl:"https://github.com/summerengine/summer",codeUrl:"https://github.com/summerengine/summer/blob/main/src/mcp/server.ts",evidenceUrl:"https://github.com/summerengine/summer/blob/main/integrations/gemini/README.md",codeScope:"CLI/MCP integration source, not the engine source. Verified src/mcp/server.ts, src/cli/commands/setup.ts, src/installer/setup.ts, gemini-extension.json, integrations/gemini/README.md, scripts/build-gemini-extension.ts, and library/skills/. The Gemini packaging document explains the actual extension skills layout rather than assuming an arbitrary manifest skills key works.",limitations:"Requires the separate Summer Engine desktop application for editor operations; the repository explicitly says it is not the engine itself. Hosted asset generation and publishing require a Summer account, and generation/paid builds consume credits. Gemini is a legacy setup target alongside current Antigravity guidance. No install or end-to-end compatibility test was performed here. This is not a Google-provided integration.",official:!1,codeType:"implementation",publisher:"summerengine",reviewed:"2026-10-18"},{id:"gemini-cli-godot-dock-bridge",title:"Gemini Assistant: a Godot dock backed by the actual Gemini CLI",kind:"bridge",agents:["gemini-cli"],engine:"Godot 4 · GDScript · Python",summary:"A small community Godot editor plugin that sends prompts from a dock to a Python subprocess, invokes the installed gemini command, and handles returned file/folder creation instructions. Its code confirms a CLI integration rather than a direct Gemini API chat wrapper.",sourceUrl:"https://github.com/AlexonMorris/gemini_assistant_godot_plugin",codeUrl:"https://github.com/AlexonMorris/gemini_assistant_godot_plugin/blob/main/gemini_backend.py",evidenceUrl:"https://github.com/AlexonMorris/gemini_assistant_godot_plugin/blob/main/README.md",codeScope:"Editor-plugin source: gemini_plugin.gd registers the dock, gemini_dock.gd launches Python, and gemini_backend.py runs the gemini executable, parses JSON action blocks, and creates project files. Supporting dock scene and plugin configuration are in the repository.",limitations:"Prototype bridge, not a complete game or full editor-control MCP server. Returned JSON file actions are applied automatically and existing files are opened in overwrite mode. The backend rejects '..' strings but does not enforce canonical project-root containment, so review it before use on valuable projects. It uses Windows type; macOS/Linux need the documented cat change. The dock expects python and addons/gemini_assistant/. Gemini CLI installation/authentication are separate prerequisites. No runtime validation was performed.",official:!1,codeType:"implementation",publisher:"AlexonMorris",reviewed:"2026-10-18"},{id:"phaser-official-agent-skills",title:"Phaser 4: official coding-agent skills with engine code examples",kind:"skill",agents:["claude-code","codex","cursor","antigravity","copilot"],engine:"Phaser 4 · JavaScript / TypeScript",summary:"The Phaser engine repository now provides subsystem skills for agent-assisted development, including scenes, Arcade/Matter physics, input, assets, cameras, animation, UI, and migration. The official README explicitly names several coding agents, and the skills contain practical API examples linked to engine source.",sourceUrl:"https://github.com/phaserjs/phaser#ai-assisted-game-development",codeUrl:"https://github.com/phaserjs/phaser/tree/master/skills",evidenceUrl:"https://github.com/phaserjs/phaser/blob/master/skills/physics-arcade/SKILL.md",codeScope:"Reusable instruction files with JavaScript examples, backed by the engine implementation. Verified skills/physics-arcade/SKILL.md includes player/platform setup, collision registration, keyboard movement, and GameConfig; it points to src/physics/arcade/. Other exact paths include skills/scenes/SKILL.md and skills/v3-to-v4-migration/SKILL.md.",limitations:"Targets Phaser 4; do not silently apply its rendering/migration guidance to Phaser 3 projects. A skill is knowledge and example code, not an editor-control service or a finished game. Agent names come from the official README and are not an end-to-end compatibility certification; Google models being mentioned is not treated as proof of Gemini CLI usage.",official:!0,codeType:"instructions",publisher:"Phaser Studio",reviewed:"2026-10-18"},{id:"godot-prompter-agent-skills",title:"GodotPrompter: multi-agent Godot skills and reusable movement code",kind:"skill",agents:["antigravity","claude-code","copilot","cursor","codex","opencode","grok-build"],engine:"Godot 4.x · GDScript / C#",summary:"A Godot-specific skill framework spanning gameplay, scene architecture, shaders, animation, testing, exports, and code review. It includes concrete GDScript/C# recipes, agent routing, platform-specific metadata, an OpenCode plugin, and machine-readable host verification status.",sourceUrl:"https://github.com/jame581/GodotPrompter",codeUrl:"https://github.com/jame581/GodotPrompter/tree/master/skills/player-controller",evidenceUrl:"https://github.com/jame581/GodotPrompter/blob/master/tests/agent-integration/host-smoke-matrix.json",codeScope:"Skills with implementation examples and host-integration code. Verified skills/player-controller/references/common-movement-recipes.md contains GDScript and C# dash/wall-jump recipes; .opencode/plugins/godot-prompter.js injects bootstrap context and registers skills; scripts/ validates skill/platform metadata. The repository uses master, not main.",limitations:"The author marks Claude Code and Copilot CLI verified, Cursor registration as awaiting end-to-end confirmation, and several other hosts as documented only. Antigravity uses a documented GEMINI.md path; this is not presented as a verified Gemini CLI integration. Skills do not directly operate the Godot editor, and version-specific examples require matching the project’s Godot version.",official:!1,codeType:"mixed",publisher:"jame581",reviewed:"2026-10-18"},{id:"playgama-web-game-performance-skill",title:"Playgama: web-game performance skill and executable probes",kind:"skill",agents:["gemini-cli","claude-code","codex","cursor","copilot"],engine:"Canvas / WebGL browser games",summary:"A reusable skill that measures a running game after warm-up and guides performance fixes using frame time, JavaScript cost, draw calls, and triangles. It includes both a headless measurement script and an in-game probe for real-device observation.",sourceUrl:"https://github.com/Playgama/gamedev-skills",codeUrl:"https://github.com/Playgama/gamedev-skills/tree/main/skills/web-game-performance",evidenceUrl:"https://github.com/Playgama/gamedev-skills/blob/main/skills/web-game-performance/README.md",codeScope:"SKILL.md plus scripts/perf.mjs and scripts/probe.js. Verified perf.mjs launches Puppeteer, accepts URL, warm-up/duration, phone emulation, readiness/setup hooks, JSON output, and before/after comparison. Root README explicitly documents Gemini CLI and the other named skill hosts.",limitations:"Needs Node 18+ and Puppeteer or puppeteer-core plus a Chrome executable. A throttled headless run is not a measurement of an actual phone; the author distinguishes comparable local runs from real-device telemetry. This is game-validation tooling, not a new game or a Google-authored extension.",official:!1,codeType:"mixed",publisher:"Playgama",reviewed:"2026-10-18"},{id:"playgama-web-game-assets-skill",title:"Playgama: asset-production skill and GLB/audio build pipeline",kind:"skill",agents:["gemini-cli","claude-code","codex","cursor","copilot"],engine:"Web games · glTF / GLB assets",summary:"A coding-agent skill for choosing a coherent asset set, recording credits, and preparing it for shipping. Its executable pipeline cleans and compresses GLB models while preserving names, handles audio conversion, and can re-encode textures.",sourceUrl:"https://github.com/Playgama/gamedev-skills",codeUrl:"https://github.com/Playgama/gamedev-skills/tree/main/skills/web-game-assets",evidenceUrl:"https://github.com/Playgama/gamedev-skills/blob/main/skills/web-game-assets/README.md",codeScope:"SKILL.md plus scripts/assets.mjs. Verified the script’s geometry/texture/audio options, incremental hashing, name-preserving glTF processing, and CLI entry. Root installation matrix explicitly covers Gemini CLI, Claude Code, Codex, Cursor, and Copilot.",limitations:"Requires Node 18+, glTF Transform, meshoptimizer, optional sharp, and ffmpeg for audio. Third-party components and assets are not bundled. This processes selected assets; it is not a generative-image/model service, a game engine, or a finished game.",official:!1,codeType:"mixed",publisher:"Playgama",reviewed:"2026-10-18"},{id:"gamedev-agent-skills-router",title:"GameDev Agent Skills: engine router and test/code recipes",kind:"skill",agents:["gemini-cli","claude-code","codex","cursor","copilot","cline"],engine:"Godot · Unity · Unreal · Bevy · Phaser · PixiJS · Three.js · LÖVE · pygame · Roblox",summary:"A community skill library whose router detects the project’s engine and loads task-specific guidance. Beyond a directory of links, it contains the actual skill bodies, source-backed code recipes, a skill validator, and asset-report/preview utilities.",sourceUrl:"https://github.com/gamedev-skills/awesome-gamedev-agent-skills",codeUrl:"https://github.com/gamedev-skills/awesome-gamedev-agent-skills/tree/main/skills",evidenceUrl:"https://github.com/gamedev-skills/awesome-gamedev-agent-skills/blob/main/router/SKILL.md",codeScope:"Router and engine/discipline/genre/workflow SKILL.md files. Verified skills/godot/godot-gdscript-headless-testing/SKILL.md contains a SceneTree test-runner recipe and explicit failure exit handling; scripts/validate-skills.py validates the collection; skills/disciplines/create-game-assets/scripts/ includes asset_report.py and build_preview_sheet.py. README names native Gemini CLI support.",limitations:"Primarily a version-targeted instruction/example library rather than an engine-control runtime. Current Godot testing guidance targets 4.7; other engine groups have their own baselines. Install compatibility statements are the maintainer’s claims, and this research did not execute cross-agent smoke tests.",official:!1,codeType:"instructions",publisher:"gamedev-skills",reviewed:"2026-10-18"},{id:"aider-pong-game-editing-transcript",title:"Aider: an official Pong build transcript with real code edits",kind:"workflow",agents:["aider"],engine:"pygame · Python",summary:"Aider’s own example records building Pong and then changing paddle colors, size, and ball behavior. It exposes the actual edit blocks and applied Git commits, making the incremental coding workflow inspectable rather than presenting an unexplained final screenshot.",sourceUrl:"https://aider.chat/examples/pong.html",codeUrl:"https://github.com/Aider-AI/aider/blob/main/aider/website/examples/pong.md",evidenceUrl:"https://github.com/Aider-AI/aider/blob/main/aider/website/examples/2048-game.md",codeScope:"Published transcript with Python edit blocks for pong_game.py, Paddle/Ball classes, input, collision, drawing, ball reset, and customizations. Numeric score display is suggested rather than implemented in this transcript. The related 2048 transcript shows inspecting js/game_manager.js and patching its scoring logic in an existing public JavaScript game.",limitations:"Historical documentation examples, not a separately packaged current game repository or benchmark. Reconstruct the applied edits and install pygame to run Pong; no current model-performance claim is implied. The original 2048 game is human-authored and is only used to demonstrate an AI-assisted modification.",official:!0,codeType:"instructions",publisher:"Aider",reviewed:"2026-10-18"}];var Ys=O(Ge(),1);Ze();Ua();var R=O(X(),1),Dw={implementation:"Executable source",instructions:"Instructions & examples",mixed:"Code + instructions"};function pp(){let[e,a]=(0,Ys.useState)("all"),[t,o]=(0,Ys.useState)("all"),[i,n]=(0,Ys.useState)(""),[s,r]=(0,Ys.useState)(!1),l=i.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean),c=li.filter(d=>{if(e!=="all"&&!d.agents.some(v=>v===e)||t!=="all"&&d.kind!==t)return!1;let p=[d.title,d.engine,d.summary,d.codeScope,d.limitations,d.publisher,...d.agents.map(v=>Vt[v])].join(" ").toLocaleLowerCase();return l.every(v=>p.includes(v))}),m=s?c:c.slice(0,4),h=()=>{a("all"),o("all"),n(""),r(!1)};return(0,R.jsxs)("section",{className:"agent-code-hub learning-section",id:"agent-game-code","aria-labelledby":"agent-game-code-heading",children:[(0,R.jsx)("div",{className:"section-heading",children:(0,R.jsxs)("div",{children:[(0,R.jsx)("span",{className:"micro-label",children:"CODING AGENTS
