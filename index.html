ne 18, 2026, and that Gemini CLI is not optimized for the latest Gemini models. Check the account-specific migration guidance before choosing this entry point.",url:"https://github.com/google-gemini/gemini-cli",links:[{label:"Official documentation",url:"https://geminicli.com/docs/"}],tags:["CLI","Google","MCP","Open source","Migration guidance"],stages:["plan","code","test"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"deepseek-agent-integrations",name:"DeepSeek · Agent Integrations",category:"agents",type:"docs",summary:"Official guidance for using DeepSeek as a model backend within agent harnesses such as Claude Code.",detail:"The Anthropic API compatibility layer connects DeepSeek to existing tool loops. The harness handles files, tests, and engine connections. The guide supports ordinary tool calls but ignores the server-side mcp_servers field and does not support MCP-specific content blocks. Client-side MCP tools therefore remain the harness's responsibility; API compatibility does not establish complete feature parity.",url:"https://api-docs.deepseek.com/guides/anthropic_api/",tags:["DeepSeek","Model backend","Harness","API compatibility","Scope"],stages:["plan","code","test"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"opencode",name:"OpenCode",category:"agents",type:"agent",summary:"An open-source coding agent with multiple model providers, Plan / Build modes, and project instructions.",detail:"Useful for planning and editing game projects with independently selected providers and models. Pin V1 or V2: the V2 migration guide documents incompatible plugin/server APIs, external-directory access allowed by default, and no running LSP or LSP diagnostics despite accepted configuration. Validate permissions, MCP integrations, and compiler/test feedback for the chosen version; editor and gameplay inspection still require separate tools.",url:"https://opencode.ai/docs/",links:[{label:"Source code",url:"https://github.com/anomalyco/opencode"},{label:"V1 to V2 migration boundaries",url:"https://opencode.ai/v2/docs/migrate-v1/"}],tags:["CLI","Multiple models","Plan / Build","Open source","AGENTS.md"],stages:["plan","code","test"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"cline",name:"Cline",category:"agents",type:"agent",summary:"An open-source coding agent with multiple models, Plan / Act modes, project rules, and MCP support.",detail:"Useful for reviewing and editing game code in an IDE or CLI, with build output and MCP editor tools in the feedback loop. Reuse .clinerules and skills to capture engine conventions; editor operations depend on the specific bridge service.",url:"https://github.com/cline/cline",links:[{label:"Documentation",url:"https://docs.cline.bot/"}],tags:["IDE","CLI","Multiple models","MCP","Plan / Act"],stages:["plan","code","test"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"aider",name:"Aider",category:"agents",type:"agent",summary:"A terminal AI pair-programming tool built around repository maps, Git changes, and lint and test feedback.",detail:"Useful for changes across files, refactoring, and testable logic in existing game projects, with model options including DeepSeek. Its code editing workflow does not directly control Unity, UE, or Blender editors; visual feedback needs a separate setup.",url:"https://github.com/Aider-AI/aider",links:[{label:"User documentation",url:"https://aider.chat/docs/"}],tags:["CLI","Git","Repository map","Multiple models","Refactoring"],stages:["code","test"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"openhands",name:"OpenHands · Agent Canvas",category:"agents",type:"framework",summary:"An open-source development console for managing local, remote, and cloud agent environments.",detail:"Can centralize multi-agent tasks, environments, and execution records for game projects. The repository provides the Agent Canvas frontend and orchestration entry point; the core tool loop and Agent Server live in a separate SDK repository. Game automation still requires engine tools.",url:"https://github.com/OpenHands/OpenHands",links:[{label:"Core SDK",url:"https://github.com/OpenHands/software-agent-sdk"}],tags:["Agent Canvas","Environments","Multi-agent","Open source","Orchestration"],stages:["plan","code","test","ship"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"openhands-sdk",name:"OpenHands Software Agent SDK",category:"agents",type:"framework",summary:"A programmable development framework for agents, tools, conversations, workspaces, and server interfaces.",detail:"Useful for game development experiments: wrap builds, scene inspections, and tests as tools for a coding agent, and record execution in local or container workspaces. The SDK supports custom workflows and tools; it does not include a semantic layer for every game engine.",url:"https://github.com/OpenHands/software-agent-sdk",links:[{label:"SDK documentation",url:"https://docs.openhands.dev/sdk"}],tags:["SDK","Python","TypeScript","Workspaces","Reproducible experiments"],stages:["plan","code","test"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"claude-agent-sdk",name:"Claude Agent SDK",category:"agents",type:"framework",summary:"Embed Claude Code's tool loop, permissions, sessions, and extensions in Python or TypeScript applications.",detail:"Runs the Claude Code binary and tool loop inside a process you operate, with Python or TypeScript APIs for permissions, sessions, hooks, and MCP. It can support game-specific repair and validation services, but domain tools, scoring rules, and runtime environments must be supplied. This differs from a Client SDK for direct model calls; the official overview also specifies Anthropic Commercial Terms and separate authentication constraints.",url:"https://code.claude.com/docs/en/agent-sdk/overview",tags:["SDK","Python","TypeScript","MCP","Hooks"],stages:["plan","code","test"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"mini-swe-agent",name:"mini-swe-agent",category:"agents",type:"framework",summary:"A minimal shell-based coding-agent research baseline designed for modification and trace inspection.",detail:"Useful for isolating model, prompt, and environment effects in game code generation and repair, or wrapping headless engine commands. Its minimal loop executes commands in independent subprocesses rather than a persistent shell, so working-directory and environment setup must be carried into each command or script. It is a general software-engineering baseline; playability, visuals, and physics require additional validation.",url:"https://github.com/SWE-agent/mini-swe-agent",links:[{label:"Predecessor: SWE-agent",url:"https://github.com/SWE-agent/SWE-agent"}],tags:["Research baseline","Shell","Harness","Traces","Open source"],stages:["code","test"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"agents-md",name:"AGENTS.md",category:"agents",type:"docs",summary:"An open Markdown format for giving coding agents build commands, test rules, and project conventions.",detail:"Game projects can record engine versions, launch commands, directory rules, asset import conventions, and acceptance checks to reduce environment guesswork. This is a project instruction format rather than an agent runtime; discovery and configuration vary by client.",url:"https://agents.md/",tags:["Project instructions","Project conventions","Open format","Context"],stages:["plan","code","test","ship"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"agent-skills-format",name:"Agent Skills",category:"agents",type:"docs",summary:"An open format that packages domain workflows as SKILL.md instructions, scripts, and reference materials.",detail:"Useful for repeatable game tasks such as sprite normalization, GLB export, scene inspection, and regression testing, with domain knowledge loaded as needed. Skills provide procedures and resources; engine control still requires tools, dependencies, and a compatible client.",url:"https://agentskills.io/home",tags:["Skills","Open format","Workflows","Progressive loading"],stages:["plan","code","assets","scene","test","ship"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"codex-browser-games",name:"Codex · Create Browser-based Games",category:"agents",type:"docs",summary:"OpenAI's browser game workflow covering planning, project instructions, asset generation, and browser iteration.",detail:"Define the player goal, core loop, inputs, and win and loss conditions, then implement with PLAN.md and AGENTS.md. Combine image skills and Playwright for visual and interaction feedback. This is a practical guide, not a performance guarantee for every game genre or a research benchmark.",url:"https://learn.chatgpt.com/use-cases/browser-games",tags:["Official workflow","Browser games","Planning","Playwright","Asset consistency"],stages:["plan","code","assets","test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"unity-mcp",name:"MCP for Unity",category:"agents",type:"tool",summary:"A community MCP bridge connecting general-purpose coding agents to the Unity Editor.",detail:"Exposes editor operations for scenes, GameObjects, C# scripts, assets, and tests. The checked v10 installation documentation lists Unity 2021.3 LTS through Unity 6.x, plus Python 3.10+ and uv. These are declared requirements, not versions tested here. The project is independent of Unity Technologies; pin bridge/editor versions and validate compilation, screenshots, and PlayMode tests.",url:"https://github.com/CoplayDev/unity-mcp",links:[{label:"Installation and tool documentation",url:"https://coplaydev.github.io/unity-mcp/"}],tags:["Unity","MCP","Editor bridge","Community project","C#"],stages:["code","assets","scene","test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"unity-mcp-skill",name:"Unity-MCP Operator Guide",category:"agents",type:"skill",summary:"A practical MCP for Unity skill: inspect editor state, act, wait for compilation and domain reload, then verify results.",detail:"Defines resource-first scene operations and requires checking compilation, domain reload, tool readiness, and blocking reasons before further edits. Script changes are followed by console and screenshot checks. This is a procedure source for MCP for Unity, not an installed or tested integration here; examples and parameters depend on bridge, Unity, UI, and input-system versions.",url:"https://github.com/CoplayDev/unity-mcp/blob/main/unity-mcp-skill/SKILL.md",tags:["Unity","Skills","MCP","Compilation feedback","Skill source"],stages:["code","scene","test"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"godot-mcp",name:"Godot MCP · Coding-Solo",category:"agents",type:"tool",summary:"A community MCP server for launching Godot, running projects, reading logs, and performing basic scene operations.",detail:"Supports project execution, debug output capture, scene and node creation, Sprite2D texture loading, and some 3D MeshLibrary operations. It can give agents feedback from real projects; these interfaces do not provide complete visual playtesting or every editor feature. At the checked commit, the server keeps one active project process and sends kill before spawning another without awaiting prior exit. Stop returns after sending a kill request rather than waiting for process exit; natural exit clears the handle used by get_debug_output. Archive output separately for reliable crash evidence.",url:"https://github.com/Coding-Solo/godot-mcp",tags:["Godot","MCP","GDScript","Runtime logs","Scenes"],stages:["code","scene","test"],dimensions:["2d","3d"],verified:"2026-10-18",links:[{label:"Pinned implementation and lifecycle limits",url:"https://github.com/Coding-Solo/godot-mcp/blob/1209744fad78f3998f98c7394fd0f6ef50da5281/src/index.ts#L1053-L1215"}]},{id:"mcp-for-blender",name:"MCP for Blender",category:"agents",type:"tool",summary:"A Blender add-on and MCP server for agent-driven modeling, materials, Python execution, and visual feedback.",detail:"Useful for 3D game asset production and scene prototypes, with viewport feedback for geometry, materials, and layout. Previously named blender-mcp, it is a third-party community integration. Its code-execution tool can run arbitrary Python inside Blender; use trusted tasks and saved project copies. Check topology, scale, UVs, collision, and export compatibility separately.",url:"https://github.com/ahujasid/mcp-for-blender",tags:["Blender","MCP","Python","3D assets","Community project"],stages:["code","assets","scene","test"],dimensions:["3d"],verified:"2026-10-18"},{id:"unreal-mcp",name:"Unreal MCP · chongdashu",category:"agents",type:"tool",summary:"A Python MCP server and UE C++ plugin connecting agents to Actors, Blueprints, and viewport controls.",detail:"Covers Actor transforms, Blueprint classes and components, some node graphs, and editor camera operations. The README declares Unreal Engine 5.5+ and Python 3.12+ and supplies a UE5.5 example; later-version compatibility is not independently tested here. The author marks it experimental and advises against production use. Pin versions and verify supported operations individually.",url:"https://github.com/chongdashu/unreal-mcp",links:[{label:"Tool documentation",url:"https://github.com/chongdashu/unreal-mcp/tree/main/Docs"}],tags:["Unreal Engine","MCP","Blueprint","Experimental","Editor bridge"],stages:["code","scene","test"],dimensions:["3d"],verified:"2026-10-18"},{id:"playwright-mcp",name:"Playwright MCP",category:"agents",type:"tool",summary:"Microsoft's browser automation MCP server for exposing page structure, interactions, and browser feedback to agents.",detail:"Useful for browser game menus, HUDs, launch flows, keyboard input, and screenshots. The default interface uses accessibility trees; coordinate-based mouse tools require the optional vision capability. Neither interface automatically exposes internal Canvas or WebGL state, so game debug instrumentation may be needed. The separate Playwright CLI repository provides a CLI + Skills workflow.",url:"https://github.com/microsoft/playwright-mcp",tags:["Playwright","MCP","Browser testing","HUD","Canvas limitations"],stages:["test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"godot-engine",name:"Godot Engine · Official Documentation",category:"engines",type:"tool",summary:"An open-source 2D and 3D game engine that organizes runnable projects through scenes, nodes, resources, and scripts.",detail:"Provides authoritative context for GDScript, C#, scene, and resource APIs, helping agents connect script changes to running scenes. Pin the engine version and use matching documentation; stable and development branches are not interchangeable.",url:"https://docs.godotengine.org/en/stable/",links:[{label:"Engine source",url:"https://github.com/godotengine/godot"},{label:"Official examples",url:"https://github.com/godotengine/godot-demo-projects"}],tags:["Godot","GDScript","Scenes and nodes","Official documentation","Open source"],stages:["plan","code","assets","scene","test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"godot-command-line",name:"Godot · Command Line Tutorial",category:"engines",type:"docs",summary:"Godot's official CLI reference for headless operation, script checks, asset import, execution, and export.",detail:"Lets coding agents launch projects, read logs, parse scripts, and export builds through commands, reducing GUI dependence. The --check-only flag parses a script supplied with --script; it does not execute gameplay tests. Supported flags vary by build type, and headless runs cannot replace real rendering and input tests.",url:"https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html",tags:["Godot","CLI","Headless","Builds","Reproducibility"],stages:["code","test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"godot-demo-projects",name:"Godot Demo Projects",category:"engines",type:"docs",summary:"Official runnable Godot examples covering 2D, 3D, GUI, audio, networking, and rendering.",detail:"Useful as minimal reference projects and regression tasks for agents, with concrete examples of scenes, scripts, and resources. The repository states that master targets the development engine; choose a matching branch for a stable release to avoid mistaking version conflicts for generation failures.",url:"https://github.com/godotengine/godot-demo-projects",tags:["Godot","Official examples","Runnable source","Version branches","Reference projects"],stages:["plan","code","scene","test"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"godot-gut",name:"GUT · Godot Unit Test",category:"engines",type:"tool",summary:"A community Godot testing framework for GDScript assertions, test doubles, and parameterized cases.",detail:"Provides a CLI and JUnit XML output for automated regression checks on generated game state, damage, inventory, and other logic. GUT and Godot versions have explicit compatibility requirements; passing logic tests still leaves visuals, controls, and scene integration to check.",url:"https://github.com/bitwes/Gut",links:[{label:"Author documentation",url:"https://gut.readthedocs.io/"}],tags:["Godot","Unit testing","GDScript","CLI","JUnit"],stages:["code","test"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"gdquest-first-2d-game",name:"GDQuest · First 2D Game",category:"engines",type:"community",summary:"A GDQuest tutorial for a Godot 2D survival game, with complete scripts, a project, and troubleshooting notes.",detail:"Covers movement, aiming, projectiles, enemy spawning, and failure states as a reference for a complete core loop. The tutorial was made with Godot 4.1 and updated to 4.6. Its troubleshooting explains grounded / floating modes and an enemy count limit. Code uses MIT while art assets use CC BY-NC-SA 4.0; check reuse conditions separately.",url:"https://www.gdquest.com/library/first_2d_game_godot4_vampire_survivor/",links:[{label:"Project source",url:"https://github.com/gdquest-demos/getting-started-with-godot-4"},{label:"Tutorial library",url:"https://www.gdquest.com/library/"}],tags:["Godot","Community experience","Complete core loop","Collision debugging","2D"],stages:["plan","code","scene","test"],dimensions:["2d"],verified:"2026-10-18"},{id:"unity-engine",name:"Unity · Manual",category:"engines",type:"tool",summary:"Official Unity documentation for projects, the editor, scripting, rendering, physics, asset import, and publishing.",detail:"Provides agents with concrete C# and editor project constraints, plus 2D and 3D workflows and versioned package references. Pin the Editor, render pipeline, and Package Manager versions together; the Unity name alone does not establish API or material compatibility.",url:"https://docs.unity3d.com/Manual/index.html",links:[{label:"Official example source",url:"https://github.com/Unity-Technologies/2d-techdemos"}],tags:["Unity","C#","Official documentation","Editor","Package Manager"],stages:["plan","code","assets","scene","test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"unity-test-framework",name:"Unity Test Framework",category:"engines",type:"tool",summary:"Unity's official testing framework, with Edit mode, Play mode, and command-line execution.",detail:"Enables ongoing regression checks for generated scripts and scene behavior, using UnityTest across frames to check lifecycles, coroutines, and state changes. Edit mode and Play mode have different execution loops; tests should wait for real frames or conditions rather than only confirming script creation. The separately checked Test Framework 1.4.6 API returns a job GUID and documents multi-frame cancellation cleanup. Active tests become Canceled and remaining tests NotRun; do not equate cancellation with passing or assume compatibility with every Editor package version.",url:"https://docs.unity3d.com/6000.2/Documentation/Manual/test-framework/test-framework-introduction.html",links:[{label:"Package and API documentation",url:"https://docs.unity3d.com/Packages/com.unity.test-framework@latest/"},{label:"Versioned test-job and cancellation API",url:"https://docs.unity3d.com/Packages/com.unity.test-framework@1.4/api/UnityEditor.TestTools.TestRunner.Api.TestRunnerApi.html"}],tags:["Unity","Testing","Edit mode","Play mode","CLI"],stages:["code","test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"unity-2d-techdemos",name:"Unity · 2D Tech Demos",category:"engines",type:"docs",summary:"Official Unity 2D example source for Tilemaps, Scripted Tiles, brushes, and runtime map changes.",detail:"Offers concrete references for tile collision lookup, destructible maps, and palette switching so agents can inspect editor configuration. Check project files and package manifests together; older examples may not work with every current Editor and package combination.",url:"https://github.com/Unity-Technologies/2d-techdemos",tags:["Unity","2D","Tilemap","Official examples","Runnable source"],stages:["code","assets","scene","test"],dimensions:["2d"],verified:"2026-10-18"},{id:"catlike-coding-movement",name:"Catlike Coding · Surface Contact",category:"engines",type:"community",summary:"Jasper Flick's Unity movement tutorial explains character control through slopes, steps, and contact timing.",detail:"The author uses test scenes to reproduce loss of ground contact, ghost collisions, raycasts, and ground snapping, giving agents causal explanations of physics behavior. The tutorial uses Unity 2019.2.14f1 and ProBuilder; adapt its algorithms, APIs, input, and project configuration to the target version.",url:"https://catlikecoding.com/unity/tutorials/movement/surface-contact/",links:[{label:"Complete movement series",url:"https://catlikecoding.com/unity/tutorials/movement/"},{label:"Shader and project tutorials",url:"https://catlikecoding.com/unity/tutorials/"}],tags:["Unity","Community experience","Physics","Character control","Debugging"],stages:["code","scene","test"],dimensions:["3d"],verified:"2026-10-18"},{id:"unreal-engine",name:"Unreal Engine · Documentation",category:"engines",type:"tool",summary:"Official Epic documentation for UE C++, Blueprints, rendering, animation, physics, and packaging.",detail:"Provides authoritative context for UE projects and asset systems, with official samples illustrating complex gameplay architecture. GitHub source access requires linked Epic and GitHub accounts and the relevant authorization steps; Epic also documents a Perforce route for licensees. Source availability does not imply an open-source license.",url:"https://dev.epicgames.com/documentation/en-us/unreal-engine",links:[{label:"Source access instructions",url:"https://dev.epicgames.com/documentation/en-us/unreal-engine/downloading-source-code-in-unreal-engine"},{label:"Engine source (authorization required)",url:"https://github.com/EpicGames/UnrealEngine"}],tags:["Unreal Engine","C++","Blueprint","Official documentation","Authorized source access"],stages:["plan","code","assets","scene","test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"unreal-automation-tests",name:"Unreal · Automation Test Framework",category:"engines",type:"tool",summary:"UE's official infrastructure for unit, functional, content stress, and screenshot comparison tests.",detail:"Can bring Blueprint compilation, level loading, simulated input, and visual regression checks into an agent feedback loop, alongside interfaces such as Functional Testing. Tests require the appropriate plugins and state cleanup; the framework runs within the engine. ResumeRunTest reads an existing JSON report, resumes NotRun tests, and marks interrupted in-progress tests as failures. Preserve the report and distinguish compatible editor and client test contexts.",url:"https://dev.epicgames.com/documentation/en-us/unreal-engine/automation-test-framework-in-unreal-engine",tags:["Unreal Engine","Automated testing","Blueprint","Visual regression","Content validation"],stages:["code","scene","test","ship"],dimensions:["2d","3d"],verified:"2026-10-18",links:[{label:"Command-line reports and interrupted-run resumption",url:"https://dev.epicgames.com/documentation/en-us/unreal-engine/run-automation-tests-in-unreal-engine"}]},{id:"unreal-lyra",name:"Lyra Sample Game",category:"engines",type:"docs",summary:"Epic's modular UE5 sample game, with gameplay plugins, abilities, animation, input, and UI.",detail:"Useful for learning how Game Feature Plugins, Experiences, and the Gameplay Ability System work together in a real project. Source and content are distributed through Fab / Epic Launcher and require a matching engine version. Lyra is more complex than a minimal prototype, so study it by module.",url:"https://dev.epicgames.com/documentation/en-us/unreal-engine/lyra-sample-game-in-unreal-engine",tags:["Unreal Engine","Official sample","GAS","Modular design","Runnable project"],stages:["plan","code","scene","test"],dimensions:["3d"],verified:"2026-10-18"},{id:"epic-developer-community",name:"Epic Developer Community · UE",category:"engines",type:"community",summary:"Epic's UE community hub for author tutorials, learning materials, and version-specific discussions.",detail:"Useful for practical material, animation, Blueprint, and performance troubleshooting beyond official references. Check each contribution's author, date, engine version, and reproducible project; access to the hub does not establish that every post has been verified.",url:"https://dev.epicgames.com/community/unreal-engine",tags:["Unreal Engine","Community","Tutorials","Practical experience","Per-source verification"],stages:["plan","code","assets","scene","test"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"threejs",name:"Three.js",category:"engines",type:"tool",summary:"A JavaScript 3D rendering library for browsers, with scenes, cameras, materials, and loaders.",detail:"Lets agents build browser-testable 3D prototypes directly in TypeScript or JavaScript and inspect APIs through source and examples. Game loops, physics, navigation, saves, and other systems need separate design or integration. Validate WebGL and WebGPU paths individually.",url:"https://github.com/mrdoob/three.js",links:[{label:"Official manual",url:"https://threejs.org/manual/"},{label:"Official examples",url:"https://threejs.org/examples/"}],tags:["Three.js","JavaScript","WebGL","WebGPU","Rendering library"],stages:["plan","code","assets","scene","test","ship"],dimensions:["3d","world"],verified:"2026-10-18"},{id:"threejs-examples",name:"Three.js · Examples",category:"engines",type:"docs",summary:"Official runnable Three.js graphics examples with their HTML and JavaScript source.",detail:"Provides minimal references for loaders, lighting, materials, animation, and rendering techniques to adapt into game scenes. The website and dev branch change continuously; keep source, addons, and runtime on the same release rather than mixing example versions.",url:"https://threejs.org/examples/",links:[{label:"Example source",url:"https://github.com/mrdoob/three.js/tree/dev/examples"}],tags:["Three.js","Official examples","Materials","Loaders","Runnable source"],stages:["code","assets","scene","test"],dimensions:["3d","world"],verified:"2026-10-18"},{id:"threejs-crowd-experience",name:"Three.js · Instanced Crowd Engineering",category:"engines",type:"community",summary:"A game author's Three.js forum write-up on a single-draw-call crowd system, instance data, LOD, and staggered updates.",detail:"Offers explainable performance techniques, with the author's playable demo showing technical and visual tradeoffs. Frame rates are self-reported on the author's hardware, not a benchmark across devices. Measure GPU, CPU, bandwidth, and visual quality after optimization.",url:"https://discourse.threejs.org/t/one-draw-call-massive-crowd-performance-engineering-in-three-js/89928",links:[{label:"Community forum",url:"https://discourse.threejs.org/"}],tags:["Three.js","Community experience","Instancing","LOD","Performance"],stages:["code","scene","test"],dimensions:["3d"],year:2026,verified:"2026-10-18"},{id:"react-three-fiber",name:"React Three Fiber",category:"engines",type:"framework",summary:"A React renderer for Three.js that brings component-based, declarative scenes into the React ecosystem.",detail:"Useful for combining web HUDs, application state, and 3D scenes, with pmndrs tools for loading, interaction, and debugging. It does not supply every game system; match React, Fiber, and Three.js versions and define clear boundaries for per-frame simulation.",url:"https://r3f.docs.pmnd.rs/getting-started/introduction",links:[{label:"Source code",url:"https://github.com/pmndrs/react-three-fiber"}],tags:["Three.js","React","R3F","pmndrs","Declarative scenes"],stages:["plan","code","scene","test"],dimensions:["3d"],verified:"2026-10-18"},{id:"blender",name:"Blender",category:"engines",type:"tool",summary:"An open-source 3D creation suite for modeling, materials, rigging, animation, simulation, and rendering.",detail:"Primarily supports game asset and scene production, with agent-generated Python scripts for repeatable tasks. Blender is not a game runtime engine; verify scale, coordinates, materials, rigs, and animation after importing into Unity, UE, Godot, or a browser.",url:"https://github.com/blender/blender",links:[{label:"Official main repository",url:"https://projects.blender.org/blender/blender"},{label:"Reference manual",url:"https://docs.blender.org/manual/en/latest/"},{label:"Python API",url:"https://docs.blender.org/api/current/"}],tags:["Blender","DCC","3D assets","Animation","Open source"],stages:["assets","scene","test"],dimensions:["3d"],verified:"2026-10-18"},{id:"blender-python-quickstart",name:"Blender Python · API Quickstart",category:"engines",type:"docs",summary:"Official Blender API tutorial source covering bpy data, context, operators, and Python operations.",detail:"Provides authoritative guidance for asset scripts, especially the distinction between direct data access and operations that depend on the current mode, selection, or viewport. bpy.ops poll checks can fail because of context; scripts should inspect actual state and verify outputs, beyond syntax checks.",url:"https://github.com/blender/blender/blob/main/doc/python_api/rst/info_quickstart.rst",links:[{label:"API documentation",url:"https://docs.blender.org/api/current/"}],tags:["Blender","Python","bpy","Context","Automation"],stages:["code","assets","scene","test"],dimensions:["3d"],verified:"2026-10-18"},{id:"gltf-blender-io",name:"Khronos · glTF-Blender-IO",category:"engines",type:"tool",summary:"Khronos's official Blender glTF 2.0 importer and exporter source, including validation and roundtrip tests.",detail:"Connects Blender asset production to game runtimes and helps diagnose material, mesh, and animation conversion issues. Repository CI validates exports and compares import / export roundtrips. A valid file can still render differently in the target engine, so verify runtime imports.",url:"https://github.com/KhronosGroup/glTF-Blender-IO",links:[{label:"Technical notes",url:"https://github.com/KhronosGroup/glTF-Blender-IO/blob/main/Technical.md"}],tags:["Blender","glTF","GLB","Asset pipeline","Roundtrip validation"],stages:["assets","scene","test","ship"],dimensions:["3d"],verified:"2026-10-18"},{id:"phaser",name:"Phaser · First Game Guide",category:"engines",type:"tool",summary:"A browser 2D game framework whose official tutorial covers assets, scenes, animation, input, and collisions.",detail:"Useful for quickly building browser-testable 2D core loops organized around preload / create / update. In the tutorial, scaled static Arcade Physics objects need their collision bodies refreshed. A visible scene alone does not verify input, restart behavior, or lifecycle handling.",url:"https://docs.phaser.io/phaser/getting-started/making-your-first-phaser-game",links:[{label:"Framework source",url:"https://github.com/phaserjs/phaser"},{label:"Official documentation",url:"https://docs.phaser.io/"}],tags:["Phaser","2D","JavaScript","Browser games","Arcade Physics"],stages:["plan","code","assets","scene","test","ship"],dimensions:["2d"],verified:"2026-10-18"},{id:"phaser-examples",name:"Phaser · Examples",category:"engines",type:"docs",summary:"Official Phaser example source with runnable references for specific APIs and gameplay components.",detail:"Official examples for animation, cameras, input, physics, and scene transitions. The current README targets Phaser 4, and the labs site defaults to its latest development build; select and pin the version matching your project. The MIT license covers example code, not bundled art assets. Review asset permissions before reuse and test in a real browser.",url:"https://github.com/phaserjs/examples",tags:["Phaser","Official examples","Runnable source","2D","Version scope"],stages:["code","scene","test"],dimensions:["2d"],verified:"2026-10-18"},{id:"unreal-remote-control",name:"Unreal Engine · Remote Control API",category:"engines",type:"docs",summary:"Exposes reflected editor properties and functions over HTTP for external tooling.",detail:"Remote Control provides a native engine integration surface distinct from a community MCP bridge. Property writes can request editor transactions and change notifications, but an acknowledged mutation does not establish package-save completion. The rolling Epic guide labels this feature Beta and disables it by default in packaged builds and -game. Enable the appropriate plugin, restrict network exposure, and qualify editor versus packaged-runtime access separately.",url:"https://dev.epicgames.com/documentation/unreal-engine/remote-control-for-unreal-engine",links:[{label:"HTTP API reference",url:"https://dev.epicgames.com/documentation/en-us/unreal-engine/remote-control-api-http-reference-for-unreal-engine"}],tags:["Unreal Engine","HTTP","Editor automation","State mutation"],stages:["code","scene","test"],dimensions:["3d"],verified:"2026-10-18"},{id:"unity-addressables-scripting",name:"Unity · Addressables Build and Loading APIs",category:"engines",type:"docs",summary:"Builds addressable content from explicit profiles and loads assets through asynchronous handles.",detail:"The checked Addressables 1.21 documentation separates content builds from executable builds. Build settings, active profile, builder, and content-state file affect outputs. Runtime loading returns a handle whose status and result must be checked and later released. A key matching several assets can select only the first; preserve dependency and cache provenance.",url:"https://docs.unity3d.com/Packages/com.unity.addressables@1.21/manual/build-scripting-start-build.html",links:[{label:"LoadAssetAsync reference",url:"https://docs.unity3d.com/kr/Packages/com.unity.addressables%401.21/api/UnityEngine.AddressableAssets.Addressables.LoadAssetAsync.html"}],tags:["Unity","Addressables","Asset dependencies","Async loading","Content builds"],stages:["assets","code","ship","runtime"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"gamegpt",name:"GameGPT",category:"2d",type:"paper",summary:"Studies automated game development through multi-agent planning and code generation.",detail:"Planning, review, and implementation agents break down game requirements and generate code, with a focus on hallucination and redundancy. This is an early research framework for game development agents. The linked repository contains only the paper and README; it is not a verified, ready-to-deploy product.",url:"https://arxiv.org/abs/2310.08067",links:[{label:"Paper and README repository",url:"https://github.com/leyiwo/GameGPT"}],tags:["Multi-agent","Task planning","Research prototype"],stages:["plan","code","test"],dimensions:["2d","3d"],year:2023,verified:"2026-10-18"},{id:"opengame",name:"OpenGame",category:"2d",type:"agent",summary:"Generates browser game projects with reusable templates and debugging skills.",detail:"Turns natural-language requirements into web projects using Template Skill and Debug Skill for Canvas, Phaser, three.js, and other templates. The public CLI accepts OpenAI-compatible model endpoints; the paper also introduces GameCoder-27B. Browser execution and visual judging assess build health, usability, and intent alignment. The README still lists the standalone evaluation pipeline as forthcoming; model weights and full evaluation reproducibility are not established by the framework release alone.",url:"https://github.com/leigest519/OpenGame",links:[{label:"Paper",url:"https://arxiv.org/abs/2604.18394"}],tags:["Browser games","Game Skill","Browser feedback","GameCoder-27B"],stages:["plan","code","assets","test"],dimensions:["2d","3d"],year:2026,verified:"2026-10-18"},{id:"gamedevbench",name:"GameDevBench",category:"2d",type:"benchmark",summary:"Evaluates coding agents on development tasks in existing Godot projects.",detail:"The repository contains 333 tasks across 2D, 3D, UI, and gameplay logic. Agents receive an existing project and a task, then produce changes that can be checked in the engine. Comparable official runs require Godot 4.4.1 and provide image or video feedback. This measures bounded development tasks, not the quality of commercial games created from scratch.",url:"https://github.com/waynchi/gamedevbench",links:[{label:"Paper",url:"https://arxiv.org/abs/2602.11103"}],tags:["Development benchmark","Godot","Multimodal","Visual feedback"],stages:["code","scene","test"],dimensions:["2d","3d"],year:2026,verified:"2026-10-18"},{id:"gamexpert-bench",name:"GameXpert-Bench",category:"2d",type:"benchmark",summary:"Benchmarks game creation, bug fixing, and iterative improvement in three tracks.",detail:"The paper introduces GameGen, GameFix, and GameOpt using complete development trajectories to study the lifecycle beyond a single generation. At review, the official repository still said data and evaluation code were being prepared for release. Treat it as a paper and protocol reference, not a ready-to-run benchmark.",url:"https://arxiv.org/abs/2608.21833",links:[{label:"Repository and release status",url:"https://github.com/Kwen-Chen/GameXpert-Bench"}],tags:["Development benchmark","Bug fixing","Iterative improvement","Full release pending"],stages:["plan","code","test"],dimensions:["2d","3d"],year:2026,verified:"2026-10-18"},{id:"gamegen-verifier",name:"GameGen-Verifier",category:"2d",type:"framework",summary:"Verifies generated game behavior through runtime state hooks and focused checks.",detail:"Breaks game requirements into independently testable checkpoints and checks functionality through browser and runtime adapters. The repository provides GGV-Harness and verifier skills for Codex and Claude. Public code does not include all generated games, run outputs, or private configurations. State hooks also provide observability beyond a purely black-box playtest.",url:"https://github.com/NetX-lab/GameGen-Verifier",links:[{label:"Paper",url:"https://arxiv.org/abs/2605.07442"}],tags:["Functional verification","Playwright","Runtime state","Verifier Skill"],stages:["code","test"],dimensions:["2d","3d"],year:2026,verified:"2026-10-18"},{id:"mariogpt",name:"MarioGPT",category:"2d",type:"paper",summary:"Generates playable Mario-style level layouts from text with a GPT model.",detail:"Descriptions of enemies, pipes, and elevation become character-grid levels and previews, with an interactive simulator or A* checks available. It generates level content within existing rules and supports research on controllable procedural content generation. Its scope does not include game engines, character art, or complete gameplay code.",url:"https://github.com/shyamsn97/mario-gpt",links:[{label:"Paper",url:"https://arxiv.org/abs/2302.05981"}],tags:["PCG","Level generation","Text-to-level","GPT-2"],stages:["plan","scene","test"],dimensions:["2d"],year:2023,verified:"2026-10-18"},{id:"gavel",name:"GAVEL",category:"2d",type:"framework",summary:"Combines language models and quality-diversity search to create board game rules.",detail:"Uses Ludii game description code as its representation. A language model mutates and recombines rules, then simulation and search select games. Code, experiments, and related model and data references are public. The outputs are board games within a rule system; these results do not establish general 2D action game development ability.",url:"https://github.com/gdrtodd/gavel",links:[{label:"Paper",url:"https://arxiv.org/abs/2407.09388"}],tags:["Game design","Ludii","Evolutionary search","Rule generation"],stages:["plan","code","test"],dimensions:["2d"],year:2024,verified:"2026-10-18"},{id:"cardiverse",name:"Cardiverse",category:"2d",type:"framework",summary:"Connects card game design, Python rule code, and playtesting in a prototype pipeline.",detail:"Uses mechanism graphs and retrieval to generate variants and code from card game descriptions, then iteratively checks rule consistency using generated match records. The repository also includes a gameplay AI arena, but its development contribution centers on rule and code prototypes. Public substitute rule descriptions differ from the original paper inputs, which affects reproducibility.",url:"https://github.com/danruili/Cardiverse",links:[{label:"Paper",url:"https://arxiv.org/abs/2502.07128"}],tags:["Card games","Mechanism graphs","Code generation","Self-play validation"],stages:["plan","code","test"],dimensions:["2d"],year:2025,verified:"2026-10-18"},{id:"agent-game-forge",name:"Agent Game Forge",category:"2d",type:"tool",summary:"A local 2D game IDE with a scene editor for Codex and Claude Code.",detail:"Agents, asset workflows, and JSON scene data turn natural-language requests into JS + Canvas games. Users can adjust layout and collision in a visual editor. The README lists web output as the current default, with full Godot and Unity support still on the roadmap. The project describes itself as pre-launch.",url:"https://github.com/0x0funky/agent-game-forge",tags:["2D IDE","Canvas","Scene editing","Prototyping"],stages:["plan","code","assets","scene","test","ship"],dimensions:["2d"],verified:"2026-10-18"},{id:"text2game",name:"Text2Game",category:"2d",type:"tool",summary:"Turns long-form text into world, character, and event data for narrative prototypes.",detail:"Analyzes text in chunks, merges the results, and generates Twine/Chapbook HTML or Godot visual novel projects. The repository provides a Python pipeline and examples for research on turning narratives into playable prototypes. It offers no general guarantee of generating arbitrary action games.",url:"https://github.com/boltomli/t2g",tags:["Interactive narrative","Twine","Godot","Visual novels"],stages:["plan","code","scene"],dimensions:["2d"],verified:"2026-10-18"},{id:"pixellab",name:"PixelLab AI Agent Toolkit",category:"2d",type:"tool",summary:"Generates pixel characters, animation, and seamless tilesets through API and MCP tools.",detail:"Accepts character descriptions, directions, actions, and terrain conditions to produce pixel assets, including four- or eight-direction characters and side-view or top-down tilesets. This is a commercial asset service. MCP connects its asset tools to coding agents; game rules, collision, and asset import still require a project workflow.",url:"https://www.pixellab.ai/mcp",links:[{label:"Documentation",url:"https://www.pixellab.ai/docs"}],tags:["Pixel art","Sprite","Tileset","MCP","Commercial service"],stages:["assets","scene"],dimensions:["2d"],verified:"2026-10-18"},{id:"agent-sprite-forge",name:"Agent Sprite Forge",category:"2d",type:"skill",summary:"Combines reference art, generated animation, and deterministic processing into exportable sprites.",detail:"Generates motion clips from an approved reference image, then performs background removal, alignment, loop selection, timing correction, and atlas packaging. It offers Godot, Aseprite, and web exports. For 0.4.0, the README reports parse-level round trips but no Godot, LDtk, or Aseprite editor-import verification. Import and visual acceptance checks remain necessary.",url:"https://github.com/0x0funky/agent-sprite-forge",tags:["Agent Skill","Sprite pipeline","Animation","Asset QA"],stages:["assets","test"],dimensions:["2d"],verified:"2026-10-18"},{id:"openai-image-api",name:"OpenAI Image Generation",category:"2d",type:"tool",summary:"Generate and edit raster art using image endpoints or a conversational image-generation tool.",detail:"Generate or edit raster images through the Images API or multi-turn Responses workflows. Save output bytes and request settings; masks guide edits rather than guaranteeing exact boundaries. Sprite consistency and seamless textures need separate checks. The technical guide does not establish output rights or retry billing.",url:"https://developers.openai.com/api/docs/guides/image-generation",links:[],tags:["asset-generation"],stages:["assets"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"gamefactory-3a",name:"3AGameFactory",category:"3d",type:"framework",summary:"Coordinates game assets, gameplay, and UI through skills, model pipelines, and engine adapters.",detail:"A coding agent routes requirements through image, 3D, motion, audio, and other pipelines to produce assets and engine-native code, with context for UE5, Unity, Godot, Blender, and three.js. Demos mix generated and existing resources. The 3A name is not a verified commercial quality rating. This is a separate project from Kling's GameFactory video world model.",url:"https://github.com/OpenDCAI/GameFactory-3A",links:[{label:"Chinese documentation",url:"https://github.com/OpenDCAI/GameFactory-3A/blob/main/README_zh.md"}],tags:["Agent Skills","Asset pipelines","Multiple engines","Game generation"],stages:["plan","code","assets","scene","test"],dimensions:["2d","3d"],year:2026,verified:"2026-10-18"},{id:"gameenginebench",name:"GameEngineBench",category:"3d",type:"benchmark",summary:"Tests agent-written C++ runtime changes in real Unreal Engine projects.",detail:"Paper v2 describes 110 scoped C++ tasks from nine Unreal projects. Agents receive a buildable start, allowed files, and behavioral requirements. After compilation and Play-in-Editor listen-server tests, an LLM judge reviews the specification, test evidence, edits, and reference solution to determine success. The paper-linked repository could not be retrieved during review, so runnable-code availability remains unverified. The scope is local C++ implementation, not complete 3D game generation.",url:"https://arxiv.org/abs/2607.03525",links:[{label:"Paper-linked repository (availability unverified)",url:"https://github.com/Nitrode-Research/GameEngineBench"},{label:"Versioned evaluation protocol",url:"https://arxiv.org/html/2607.03525v2"}],tags:["Development benchmark","Unreal Engine","C++","Behavior tests"],stages:["code","test"],dimensions:["3d"],year:2026,verified:"2026-10-18"},{id:"unity-agent-plugin",name:"Unity Agent Plugin",category:"3d",type:"skill",summary:"Unity-maintained project skills give general coding agents engine-specific context.",detail:"Provides Claude Code, Codex, and Grok with skills for 2D, UI, rendering, navigation, physics, multiplayer, and other tasks, connected to Unity CLI and MCP controls. Unity requires version 6.0 or later. The current CLI MCP mode replaces MCP in the older assistant package; follow the documentation for the version in use.",url:"https://docs.unity.com/en-us/ai/unity-plugin/about-unity-plugin",links:[{label:"Skill source",url:"https://github.com/Unity-Technologies/unity-agent-plugin/tree/main/skills"},{label:"CLI / MCP migration",url:"https://docs.unity.com/en-us/unity-cli/replace-mcp-server-unity-cli"}],tags:["Official","Agent Skills","Unity","CLI","MCP"],stages:["plan","code","scene","test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"mcp-unity",name:"MCP Unity Editor",category:"3d",type:"tool",summary:"A community MCP bridge for querying, editing, and testing Unity projects.",detail:"Exposes scenes, GameObjects, components, Prefabs, logs, Unity Test Runner, and other editor operations to MCP clients. This community tool is separate from Unity's official plugin. Its README warns that entering Play Mode with domain reload can disconnect the bridge; check the installed version, test configuration, and actual results. Editor automation alone does not establish correct gameplay.",url:"https://github.com/CoderGamester/mcp-unity",tags:["Unity","MCP","Editor automation","Community tool"],stages:["code","scene","test"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"godot-3d-asset-skill",name:"Godot MCP 3D Asset Builder",category:"3d",type:"skill",summary:"Builds reusable stylized 3D assets with Godot geometry and validation workflows.",detail:"Takes project style and asset requirements, then uses Godot MCP and deterministic builders to produce PackedScene assets and check grounding, collision, navigation, and screenshots. Designed for Codex and Claude Code, it can reuse existing project resources. It requires compatible MCP capabilities and is not an image-to-mesh generative model.",url:"https://github.com/LuigiDeFacci/godot-create-3d-assets",tags:["Godot","Agent Skill","PackedScene","Asset QA"],stages:["assets","scene","test"],dimensions:["3d"],verified:"2026-10-18"},{id:"hunyuan3d-2",name:"Hunyuan3D 2.0",category:"3d",type:"tool",summary:"Turns reference images into geometry and textures for 3D asset pipelines.",detail:"The 2.0 pipeline generates shape with Hunyuan3D-DiT and textures the mesh with Hunyuan3D-Paint. It supports GLB and OBJ export and a Blender addon under a dedicated Tencent Hunyuan 3D 2.0 community license. The separate 2.1 release adds a PBR texture pipeline and training code. Topology, LOD, rigging, collision, runtime performance, and each version's terms still need game-pipeline checks.",url:"https://github.com/Tencent-Hunyuan/Hunyuan3D-2",links:[{label:"2.0 paper",url:"https://arxiv.org/abs/2501.12202"},{label:"2.1 repository",url:"https://github.com/Tencent-Hunyuan/Hunyuan3D-2.1"},{label:"2.0 license",url:"https://github.com/Tencent-Hunyuan/Hunyuan3D-2/blob/main/LICENSE"}],tags:["Image-to-3D","Mesh","Textures","Blender"],stages:["assets"],dimensions:["3d"],year:2025,verified:"2026-10-18"},{id:"trellis",name:"TRELLIS",category:"3d",type:"tool",summary:"Generates meshes, Gaussians, and radiance fields from structured latent representations.",detail:"Decodes image or text inputs into several 3D representations. Official examples support textured GLB export and simplification. Conventional game asset pipelines mainly use its mesh branch; Gaussian and radiance field outputs do not themselves include usable collision, animation, or gameplay logic.",url:"https://github.com/microsoft/TRELLIS",links:[{label:"Paper",url:"https://arxiv.org/abs/2412.01506"}],tags:["Image-to-3D","Text-to-3D","GLB","Structured Latents"],stages:["assets"],dimensions:["3d"],year:2024,verified:"2026-10-18"},{id:"triposr",name:"TripoSR",category:"3d",type:"tool",summary:"Quickly reconstructs a 3D object from one image for asset prototyping.",detail:"Uses LRM-style feed-forward reconstruction, with public code, pretrained models, and a demo. An input image becomes an exportable object mesh. It focuses on individual objects; hidden surfaces, topology, and game performance need additional work. It is not a complete scene or playable game generator.",url:"https://github.com/VAST-AI-Research/TripoSR",tags:["Image-to-3D","Reconstruction","Mesh","Prototype assets"],stages:["assets"],dimensions:["3d"],year:2024,verified:"2026-10-18"},{id:"infinigen",name:"Infinigen",category:"3d",type:"framework",summary:"Procedurally generates natural and indoor Blender scenes and synthetic data.",detail:"Random seeds, parameters, and asset generators produce geometry, materials, scenes, and annotations, with export documentation for OBJ, OpenUSD, and other formats. This is a procedural system rather than a language model. It can provide controllable scenes and data for AI development workflows; real-time games still need optimization, collision, and gameplay integration.",url:"https://github.com/princeton-vl/infinigen",links:[{label:"Project and paper",url:"https://infinigen.org/"}],tags:["Procedural generation","Blender","Synthetic data","Scenes"],stages:["assets","scene","test"],dimensions:["3d"],year:2023,verified:"2026-10-18"},{id:"holodeck",name:"Holodeck",category:"3d",type:"framework",summary:"Lays out and furnishes interactive 3D indoor environments from text.",detail:"Combines language planning, asset retrieval, and spatial constraints to turn room requirements into AI2-THOR scenes, with instructions for loading them in Unity. Evaluation primarily targets embodied AI environment generation. It offers ideas for scene layout and semantic interaction, but does not establish complete game level design or commercial release readiness.",url:"https://github.com/allenai/Holodeck",links:[{label:"Paper",url:"https://arxiv.org/abs/2312.09067"}],tags:["Text-to-scene","AI2-THOR","Spatial constraints","Embodied environments"],stages:["plan","scene"],dimensions:["3d"],year:2023,verified:"2026-10-18"},{id:"video2game",name:"Video2Game",category:"3d",type:"paper",summary:"Reconstructs real-world video into interactive 3D environments for the browser.",detail:"Video and camera information pass through reconstruction, mesh extraction, appearance baking, and collision generation into a three.js game environment. The repository also documents UE import. This is an explicit environment reconstruction approach with remaining manual scene setup and physics integration. It should be distinguished from interactive video world models that predict the next frame.",url:"https://github.com/video2game/video2game",links:[{label:"Paper",url:"https://arxiv.org/abs/2404.09833"}],tags:["Video-to-3D","Reconstruction","Three.js","Collision"],stages:["assets","scene","world"],dimensions:["3d"],year:2024,verified:"2026-10-18"},{id:"blenderllm",name:"BlenderLLM / BlendNet / CADBench",category:"3d",type:"paper",summary:"Studies text-to-Blender scripting with a training dataset and modeling benchmark.",detail:"BlenderLLM generates bpy modeling scripts from user instructions. BlendNet provides about 12K paired samples, and CADBench includes synthetic and forum-sourced tasks. Evaluation focuses on basic CAD-style modeling and instruction following. The README identifies limitations in advanced materials, multimodal input, and multi-turn collaboration; this is not a game creation benchmark.",url:"https://github.com/FreedomIntelligence/BlenderLLM",links:[{label:"Paper",url:"https://arxiv.org/abs/2412.14203"},{label:"BlendNet dataset",url:"https://huggingface.co/datasets/FreedomIntelligence/BlendNet"},{label:"CADBench",url:"https://huggingface.co/datasets/FreedomIntelligence/CADBench"}],tags:["Text-to-bpy","CADBench","Dataset","Modeling benchmark"],stages:["assets","test"],dimensions:["3d"],year:2024,verified:"2026-10-18"},{id:"autoue",name:"AutoUE",category:"3d",type:"framework",summary:"Coordinates agents to build Unreal scenes, gameplay code, interactions, and playtests.",detail:"A research pipeline for turning a game description into Unreal Engine scenes and C++ gameplay. Its public implementation includes setup instructions, a demonstration video, and a linked dataset of generated games and assets. Reproduction requires Unreal integrations and external model services. The video demonstrates outputs; it is not a hosted playable game.",url:"https://github.com/Pluto156/AutoUE",links:[{label:"Paper",url:"https://arxiv.org/abs/2603.07106"},{label:"Generated games and asset dataset",url:"https://huggingface.co/datasets/Pluto156/AutoUE_DataSet"}],access:{tutorial:{label:"Setup and usage",url:"https://github.com/Pluto156/AutoUE#setup-and-usage",kind:"tutorial",note:"Author instructions for dependencies, service credentials, and running the Unreal generation pipeline."},demo:{label:"Game-generation video",url:"https://github.com/Pluto156/AutoUE/blob/main/assets/show.mp4",kind:"video",note:"Recorded demonstrations of generated Unreal games; no public browser-playable build verified."},source:{label:"Pipeline source",url:"https://github.com/Pluto156/AutoUE",kind:"pipeline-source",note:"Public framework implementation; engine setup, model services, and dataset assets remain separate requirements."}},tags:["Unreal Engine","Game generation","Multi-agent","Research prototype"],stages:["plan","code","assets","scene","test"],dimensions:["3d"],year:2026,verified:"2026-10-18"},{id:"unigen",name:"UniGen",category:"3d",type:"framework",summary:"Plans Unity prototypes, generates scripts, assembles scenes, and supports iterative debugging.",detail:"A multi-agent research workflow for Unity game creation from natural-language descriptions. The repository publishes its Python pipeline and model connector, with installation guidance and a recorded demonstration. Unity and a model-service account are required. Public pipeline code is available, but a hosted playable build and complete downloadable versions of the benchmark games were not verified.",url:"https://github.com/yxwan123/UniGen",links:[{label:"Paper",url:"https://arxiv.org/abs/2509.26161"}],access:{tutorial:{label:"Installation and usage",url:"https://github.com/yxwan123/UniGen#-installation",kind:"tutorial",note:"README covers prerequisites and the local Unity generation workflow; review paths and project setup before running."},demo:{label:"Unity generation video",url:"https://www.youtube.com/watch?v=xyJjFfnxUx0",kind:"video",note:"Author-linked demonstration video, not a browser-playable game."},source:{label:"Pipeline source",url:"https://github.com/yxwan123/UniGen",kind:"pipeline-source",note:"Published generator implementation and prompts; this is not a complete release of every benchmark game."}},tags:["Unity","Game generation","Scene assembly","Research prototype"],stages:["plan","code","scene","test"],dimensions:["3d"],year:2025,verified:"2026-10-18"},{id:"tripo-generation-api",name:"Tripo Model Generation API",category:"3d",type:"tool",summary:"Versioned text-to-model generation with separate geometry and texture seeds.",detail:"Versioned text-to-model requests expose geometry/texture seeds and optional PBR controls. Persist model_version and task ID; import only successful outputs and archive URLs promptly. Low-poly generation can fail on complex inputs. Seeds are version-scoped, while output rights, cancellation endpoints and retry charges remain unverified.",url:"https://docs.tripo3d.ai/model-generation/text-to-model-v3-0-v3-1.html",links:[{label:"Tripo task results",url:"https://docs.tripo3d.ai/task-query/get-your-task-result.html"}],tags:["asset-generation"],stages:["assets"],dimensions:["3d"],verified:"2026-10-18"},{id:"scenario",name:"Scenario",category:"production",type:"tool",summary:"Builds consistent game art pipelines with custom style models and batch generation.",detail:"Scenario provides hosted image, video, 3D and audio workflows, custom-model training, a REST API and an official beta MCP interface. Inspect each model schema before submission; MCP model_run can return an unfinished job rather than output assets. The documented job_cancel cannot cancel jobs created by model_run or workflow_run. Integration examples do not include the full hosted service or a complete game project.",url:"https://www.scenario.com/",links:[{label:"API documentation",url:"https://docs.scenario.com/"},{label:"Official beta MCP operations",url:"https://mcp.scenario.com/docs/tools/model-run"},{label:"Job cancellation scope",url:"https://mcp.scenario.com/docs/tools/job-cancel"}],access:{tutorial:{label:"Consistent game asset pipeline",url:"https://docs.scenario.com/get-started/documentation/integrating-with-applications-real-world-scenarios#1-game-asset-pipeline--batch-generation-with-style-consistency",kind:"tutorial",note:"Official walkthrough for custom style training, batch generation, and asset delivery."},demo:{label:"Asset generation app",url:"https://app.scenario.com/",kind:"interactive",note:"Hosted creative tool requiring an account; this is an asset workspace, not a playable game."},source:{label:"Unity integration source",url:"https://github.com/scenario-labs/Scenario-Unity",kind:"sdk",note:"Public Unity integration plugin; hosted model source and a complete game project are not included."}},tags:["Art direction","Style consistency","Character consistency","Batch assets","Commercial service"],stages:["assets","scene"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"meshy",name:"Meshy API",category:"production",type:"tool",summary:"Connects AI model generation, humanoid rigging, and animation export for game asset workflows.",detail:"The official animated-character recipe turns a reference image into a textured, rigged character with idle, jump, and attack clips in GLB and FBX. The animation step applies motions from Meshy's library. API rigging works best with standard textured bipeds with clearly separated limbs. Generated assets still need engine import, collision, controls, and performance checks; the public cookbook supplies asset examples rather than complete gameplay.",url:"https://docs.meshy.ai/en",links:[{label:"Rigging requirements",url:"https://docs.meshy.ai/en/api/rigging"}],access:{tutorial:{label:"Image to animated character",url:"https://www.meshy.ai/developers/cookbook/recipes/animate-3d-character/",kind:"tutorial",note:"Official guide with reference files, Python and TypeScript examples, and GLB/FBX outputs. API access uses credits."},demo:{label:"3D asset workspace",url:"https://www.meshy.ai/workspace",kind:"interactive",note:"Hosted generation and animation workspace; account access is required to generate assets. This is not a playable game."},source:{label:"Cookbook example source",url:"https://github.com/meshy-dev/meshy-cookbook",kind:"examples",note:"Public asset-generation recipes, not Meshy's model source or a complete game project."}},tags:["Image-to-3D","Rigging","Character animation","GLB","FBX","Commercial service"],stages:["assets","scene"],dimensions:["3d"],verified:"2026-10-18"},{id:"hy-motion",name:"HY-Motion 1.0",category:"production",type:"tool",summary:"Generates skeletal humanoid motion from text with public inference code and model weights.",detail:"Tencent's text-to-motion models produce human character animation, with CLI inference, local Gradio visualization, and a hosted model demo. Use the generated motion as an animation-pipeline input and retarget it to the target character. The documented limitations include non-humanoid motion, multi-person interaction, seamless loops, and in-place animation. The release provides a motion implementation, not a controllable game character or full game project. Its custom license excludes the EU, UK and South Korea and restricts using the works or outputs to improve other AI models, except HY-Motion and its derivatives. Review the exact license and commercial threshold before adoption.",url:"https://github.com/Tencent-Hunyuan/HY-Motion-1.0",links:[{label:"Official project",url:"https://hunyuan.tencent.com/motion"},{label:"Model weights",url:"https://huggingface.co/tencent/HY-Motion-1.0"},{label:"HY-Motion community license",url:"https://github.com/Tencent-Hunyuan/HY-Motion-1.0/blob/master/License.txt"}],access:{tutorial:{label:"Installation and motion workflow",url:"https://github.com/Tencent-Hunyuan/HY-Motion-1.0/blob/master/README.md",kind:"tutorial",note:"Official setup, CLI inference, local UI, and prompting guidance. Local execution requires the documented GPU resources."},demo:{label:"Interactive motion demo",url:"https://huggingface.co/spaces/tencent/HY-Motion-1.0",kind:"interactive",note:"Official text-to-motion model interface; a motion preview rather than playable gameplay. Hosted availability may vary."},source:{label:"Motion implementation source",url:"https://github.com/Tencent-Hunyuan/HY-Motion-1.0",kind:"model",note:"Public inference and visualization implementation with separately linked weights; no complete game project."}},tags:["Text-to-motion","Skeletal animation","Humanoid","Model weights","Local inference"],stages:["assets"],dimensions:["3d"],year:2025,verified:"2026-10-18"},{id:"elevenlabs-sfx",name:"ElevenLabs Sound Effects",category:"production",type:"tool",summary:"Generates game sound effects, Foley, and looping ambience from text through a web app or API.",detail:"Describe footsteps, impacts, UI feedback, or environmental sounds, control duration, and export audio for a game engine. Effects can loop seamlessly; a single generation is limited to 30 seconds. MP3 is supported, with 48 kHz WAV for non-looping effects. This is a hosted audio service. The public SDK connects to its API and does not release the generation model or a complete game project.",url:"https://elevenlabs.io/docs/overview/capabilities/sound-effects",links:[{label:"Product walkthrough",url:"https://elevenlabs.io/docs/eleven-creative/playground/sound-effects"}],access:{tutorial:{label:"Sound Effects quickstart",url:"https://elevenlabs.io/docs/eleven-api/guides/cookbooks/sound-effects",kind:"tutorial",note:"Official API walkthrough with SDK examples; an account and API key are needed for generation."},demo:{label:"Sound effects generator",url:"https://elevenlabs.io/sound-effects",kind:"interactive",note:"Official text-to-audio generator and sound examples; this is an audio tool, not a playable game."},source:{label:"Official Python SDK",url:"https://github.com/elevenlabs/elevenlabs-python",kind:"sdk",note:"API client source only; generation model and complete game source are not included."}},tags:["Sound effects","Foley","Ambience","Audio loops","API","Commercial service"],stages:["assets"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"stable-audio-open",name:"Stable Audio Open 1.0",category:"production",type:"tool",summary:"Provides downloadable text-to-audio weights and local tools for sound effects and field recordings.",detail:"Generates up to 47 seconds of stereo audio at 44.1 kHz, with examples for local inference and WAV export. The official audio-tools repository includes a local Gradio interface. The model works best with English descriptions, is stronger at sound effects and field recordings than music, and cannot produce realistic vocals. Model access requires accepting its terms and sharing contact information with the publisher; this resource is an audio pipeline rather than a complete soundtrack or game generator.",url:"https://huggingface.co/stabilityai/stable-audio-open-1.0",links:[{label:"Local demo setup",url:"https://github.com/Stability-AI/stable-audio-tools#interface"},{label:"Research paper",url:"https://arxiv.org/abs/2407.14358"}],access:{tutorial:{label:"Local inference and WAV export",url:"https://huggingface.co/stabilityai/stable-audio-open-1.0#usage",kind:"tutorial",note:"Official model usage examples for stable-audio-tools and Diffusers."},demo:{label:"Local audio demo setup",url:"https://github.com/Stability-AI/stable-audio-tools#interface",kind:"local-tool",note:"Download and run the official Gradio audio interface locally; this link is setup guidance, not a hosted playable game."},source:{label:"Audio tools source",url:"https://github.com/Stability-AI/stable-audio-tools",kind:"model",note:"Public training and inference tools with separately downloadable model weights; no complete game project."}},tags:["Text-to-audio","Sound effects","Field recordings","Model weights","Local inference"],stages:["assets"],dimensions:["2d","3d"],year:2024,verified:"2026-10-18"},{id:"regression-games",name:"Regression Games",category:"production",type:"tool",summary:"Provides a public Unity SDK for gameplay recording, input replay, and regression-test reference workflows.",detail:"The public Unity SDK combines gameplay recording, state inspection, input playback, bot logic, and validation workflows. Its official first-test tutorial and Boss Room UI-testing project remain available in GitHub repositories. Treat this as a reference integration: the old documentation domain was unreachable during review, and current hosted-service availability and maintenance were not confirmed. SDK source is public; check compatibility and service requirements before adopting it.",url:"https://github.com/Regression-Games/RGUnityBots",links:[{label:"Unity SDK",url:"https://github.com/Regression-Games/RGUnityBots"},{label:"Boss Room UI-testing sample",url:"https://github.com/Regression-Games/UITest-BossRoom"},{label:"First-test tutorial repository fallback",url:"https://github.com/Regression-Games/RegressionDocs/blob/main/docs/getting-started/creating-your-first-automated-test.mdx"}],access:{tutorial:{label:"Your first automated test",url:"https://github.com/Regression-Games/RegressionDocs/blob/main/docs/getting-started/creating-your-first-automated-test.mdx",kind:"tutorial",note:"Official first-test walkthrough preserved in the documentation repository. The former live documentation domain was unreachable during review."},demo:{label:"Runnable Boss Room sample",url:"https://github.com/Regression-Games/UITest-BossRoom",kind:"examples",note:"A complete Unity sample project with UI tests; download and open locally rather than playing in a browser."},source:{label:"Unity testing SDK source",url:"https://github.com/Regression-Games/RGUnityBots",kind:"sdk",note:"Public client SDK source; it does not contain the complete hosted dashboard backend."}},tags:["Unity","Automated playtesting","Input replay","Regression testing","Reference integration"],stages:["test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"modl-ai",name:"modl.ai",category:"production",type:"tool",summary:"Uses visual agents and natural-language tasks to test uploaded game builds.",detail:"The current commercial service observes screens and sends simulated inputs without requiring an engine SDK. Teams upload a build, describe test tasks, and review captured sessions and bug reports. Its stated coverage includes Android and desktop; timing-critical gameplay remains limited. The vendor also describes game-specific model training using test-run data; SDK-free does not mean no game-specific preparation. The current product differs from older SDK-based documentation. Public self-service gameplay, complete product source, and an independent hands-on tutorial were not verified.",url:"https://modl.ai/",links:[{label:"Request a product demonstration",url:"https://modl.ai/contact"}],access:{tutorial:{label:"Workflow overview",url:"https://modl.ai/",kind:"service",note:"Official upload, task-definition, and reporting overview; detailed onboarding is provided through the service."},demo:{label:"Book a product demo",url:"https://modl.ai/contact",kind:"service",note:"Commercial demonstration by arrangement; this is not a public playable game or instant sandbox."},source:{label:"Full product source unavailable",kind:"unavailable",note:"No complete source release for the current hosted testing product was verified; older public samples are not its backend."}},tags:["Automated playtesting","Visual agents","Commercial service","Game QA"],stages:["test","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"convai",name:"Convai",category:"production",type:"tool",summary:"Adds conversational NPCs with speech, memory, emotion, and in-scene actions.",detail:"Convai connects game characters to runtime conversation and behavior services through engine integrations. Its Unity guides cover installation, sample scenes, and character setup; public Unreal SDK source is also available. Browser experiences require an account. This provides AI behavior inside an existing game, rather than generating a complete game. Public SDKs do not include the full hosted AI service.",url:"https://convai.com/",links:[{label:"Unity SDK documentation",url:"https://docs.convai.com/api-docs/plugins-and-integrations/convai-unity-sdk"},{label:"Unreal SDK source",url:"https://github.com/Conv-AI/Convai-UnrealEngine-SDK-V4"},{label:"Projects and experiences",url:"https://convai.com/gallery"}],access:{tutorial:{label:"Build your first AI character",url:"https://docs.convai.com/api-docs/plugins-and-integrations/convai-unity-sdk/getting-started",kind:"tutorial",note:"Official Unity installation, service setup, sample-scene, and custom-character walkthrough."},demo:{label:"Try character experiences",url:"https://x.convai.com/",kind:"interactive",note:"Account-required browser character experiences; these are conversations and role-play, not complete game-generation demos."},source:{label:"Unreal engine SDK source",url:"https://github.com/Conv-AI/Convai-UnrealEngine-SDK-V4",kind:"sdk",note:"Public engine integration source; the complete cloud conversation service is not included."}},tags:["Runtime AI","NPC dialogue","Character actions","Unity / Unreal"],stages:["code","scene","runtime"],dimensions:["3d"],verified:"2026-10-18"},{id:"unreal-gauntlet",name:"Unreal Engine · Gauntlet",category:"production",type:"docs",summary:"Orchestrates game test sessions with multiple processes, roles, devices, and collected logs.",detail:"Gauntlet consumes prepared cooked builds and launches configured game roles through AutomationTool. Game-specific test nodes define assertions and terminal outcomes; launching a client and server alone does not establish scenario success. Build production, device availability, process cleanup, and parallel-session port allocation remain separate responsibilities.",url:"https://dev.epicgames.com/documentation/unreal-engine/gauntlet-automation-framework-overview-in-unreal-engine?lang=en-US",links:[],tags:["Unreal Engine","AutomationTool","Multi-process testing","Cooked builds"],stages:["test","ship"],dimensions:["3d"],verified:"2026-10-18"},{id:"windows-ui-automation",name:"Windows · UI Automation and Input Semantics",category:"production",type:"docs",summary:"Provides native accessibility control patterns and a Win32 input bridge for desktop editor automation.",detail:"Provider support must be probed per control; no specific game editor is assumed accessible. UIA coordinates are physical pixels, while absolute mouse input uses normalized desktop coordinates. Bounding rectangles may contain occluded points, foreground activation can be refused, and input insertion does not prove application completion. Integrity restrictions must be respected.",url:"https://learn.microsoft.com/en-us/windows/win32/winauto/uiauto-controlpatternsoverview",links:[{label:"Properties and occlusion",url:"https://learn.microsoft.com/en-us/windows/win32/winauto/uiauto-automation-element-propids"},{label:"Input and integrity limits",url:"https://learn.microsoft.com/en-us/windows/win32/api/winuser/nf-winuser-sendinput"},{label:"DPI coordinates",url:"https://learn.microsoft.com/en-us/windows/win32/winauto/uiauto-screenscaling"},{label:"Window/display capture and frame lifetime",url:"https://learn.microsoft.com/en-us/windows/apps/develop/media-authoring-processing/screen-capture"}],tags:["Windows","Accessibility","Native GUI","CUA","DPI"],stages:["code","scene","test"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"elevenlabs-music",name:"ElevenLabs Music",category:"production",type:"tool",summary:"Prompted music generation with composition plans, references and section editing.",detail:"Generate music with composition plans, references and section editing. Music-specific terms distinguish Indie and Studio game uses, so paid API access alone does not clear every game release. The October 2026 use policy restricts AI-development/training datasets unless expressly permitted. Reference audio rights and plan eligibility require review.",url:"https://elevenlabs.io/docs/overview/capabilities/music",links:[{label:"ElevenLabs Music terms",url:"https://elevenlabs.io/music-terms"},{label:"Prohibited Use Policy (October 2026)",url:"https://elevenlabs.io/use-policy"}],tags:["audio-generation"],stages:["assets"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"elevenlabs-speech",name:"ElevenLabs Speech Generation",category:"production",type:"tool",summary:"Voice-conditioned speech synthesis with pronunciation dictionaries and neighboring-request continuity controls.",detail:"The speech endpoint accepts versioned pronunciation dictionaries and previous/next text or request context. Zero-retention mode is enterprise-only and disables history-based continuity features; verify model compatibility. October 2026 policy restricts AI-development/training datasets and requires approval for under-18-directed products. These constraints are distinct from ordinary output-commercial rights and free-plan restrictions.",url:"https://elevenlabs.io/docs/api-reference/text-to-speech/convert",links:[{label:"Prohibited Use Policy (October 2026)",url:"https://elevenlabs.io/use-policy"},{label:"Non-EEA general terms (October 2026)",url:"https://elevenlabs.io/terms-of-use"}],tags:["speech-generation","audio-generation"],stages:["assets"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"xbox-accessibility-guidelines",name:"Xbox Accessibility Guidelines",category:"production",type:"docs",summary:"Game-specific accessibility guidance for designers, developers and test teams.",detail:"The guidelines cover accessible game experiences and provide criteria for review. They are best-practice guidance, not a legal compliance checklist or certification. Automated scans alone cannot replace manual assessment and testing with disabled players.",url:"https://learn.microsoft.com/en-us/xbox/accessibility/guidelines",tags:["Accessibility","QA","Guidelines"],stages:["plan","test"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"msdf-atlas-gen",name:"MSDF Atlas Generator",category:"production",type:"tool",summary:"A command-line and library tool for generating distance-field font atlases.",detail:"Produces glyph textures and layout metadata from fonts. The default character set is ASCII unless overridden, so multilingual coverage must be explicit. Sample atlas color channels as linear data rather than sRGB; font licensing remains independent.",url:"https://github.com/Chlumsky/msdf-atlas-gen",tags:["Fonts","MSDF","UI"],stages:["assets","ship"],dimensions:["2d","3d"],verified:"2026-10-18"},{id:"fastnoise-lite",name:"FastNoise Lite",category:"production",type:"framework",summary:"A portable noise library for procedural terrain and material inputs.",detail:"Provides 2D/3D sampling, fractals and domain warping across multiple languages under MIT. These are generation primitives: meshing, erosion, persistent world state and meaningful level design require additional systems.",url:"https://github.com/Auburn/FastNoiseLite",tags:["Procedural generation","Noise","Terrain"],stages:["code","assets","world"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"directx-shader-compiler",name:"DirectX Shader Compiler",category:"production",type:"tool",summary:"HLSL compilation through the dxc command line and compiler APIs.",detail:"Compiler-call success and shader compilation success are separate: inspect the result status, diagnostics and requested outputs. Target profiles, include dependencies and build configuration matter. A compiled shader does not establish rendering correctness or target-device compatibility.",url:"https://github.com/microsoft/DirectXShaderCompiler",links:[{label:"Compiler API guide",url:"https://github.com/microsoft/DirectXShaderCompiler/wiki/Using-dxc.exe-and-dxcompiler.dll"}],tags:["Shaders","HLSL","Build validation"],stages:["code","test","ship"],dimensions:["2d","3d","world"],verified:"2026-10-18"},{id:"playwright-test",name:"Playwright Test",category:"production",type:"tool",summary:"Browser testing with DOM actions, assertions and screenshot comparisons.",detail:"Screenshot assertions wait for two matching captures before comparison, but stable pixels do not prove application readiness. Record browser, fo
